/* ──────────────────────────────
   CSS Variables – Light & Dark
   ────────────────────────────── */
:root {
  --font-family: 'Outfit', system-ui, sans-serif;
  --fs-base: 16px;
  --radius: .5rem;
  --transition: .35s cubic-bezier(0.22,1,0.36,1);
  --color-teal: #0E9AA7;
  --color-blue: #3B5BDB;
  --color-violet: #7C3AED;
  --gradient-sky: linear-gradient(135deg, #B7EAEA, #D9CCFF, #F5F0FF);
  --bg-header: rgba(255,255,255,.6);
  --border-header: linear-gradient(90deg, transparent, var(--color-teal), transparent);
  --shadow-header: 0 4px 12px rgba(0,0,0,.08);
  --text-primary: #111;
  --text-secondary: #555;
}
@media (prefers-color-scheme: dark) {
  :root {
    --gradient-sky: linear-gradient(135deg, #0A0A23, #14122B, #1E1A35);
    --bg-header: rgba(16,15,30,.6);
    --border-header: linear-gradient(90deg, transparent, var(--color-teal), transparent);
    --shadow-header: 0 4px 12px rgba(0,0,0,.6);
    --text-primary: #EEE;
    --text-secondary: #AAA;
  }
}

/* ──────────────────────────────
   Global Reset & Typography
   ────────────────────────────── */
*,
*::before,
*::after {margin:0;padding:0;box-sizing:border-box;}
html {font-size: var(--fs-base);scroll-behavior:smooth;}
body {
  font-family: var(--font-family);
  color: var(--text-primary);
  background: var(--gradient-sky);
  min-height: 100vh;
  line-height: 1.5;
  overflow-x: hidden;
}
a {color:inherit;text-decoration:none;}
button {background:none;border:none;cursor:pointer;font:inherit;}
