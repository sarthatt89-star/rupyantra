<html lang="en-IN">

<style>
:root{color-scheme:light dark;--bg:#F6FAF8;--text:#14282B;--muted:#6B7C80;--line:#DDE7E3;--card:#fff;--acc:#0F9D6E;--acc2:#0B7D58;--tint:rgba(15,157,110,.1);--warm:#C98A14}
@media(prefers-color-scheme:dark){:root{--bg:#0D1618;--text:#E6EFEC;--muted:#8DA19D;--line:#233436;--card:#142123;--acc:#2BC58F;--acc2:#1FA876;--tint:rgba(43,197,143,.14);--warm:#E5B04A}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,textarea{font:inherit}
button{touch-action:manipulation}
#app{height:100%;min-height:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;justify-content:flex-end;align-items:center;padding:6px 12px}
.ib{width:40px;height:40px;border:0;background:none;color:var(--text);display:grid;place-items:center;border-radius:12px;cursor:pointer}
.ib:hover{background:var(--tint)}
.ib svg,.circle svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:680px;margin:0 auto;padding:0 16px}
h1{font-size:clamp(22px,6vw,30px);line-height:1.25;font-weight:600;text-align:center;margin:0 0 8px;letter-spacing:-.01em}
h1 span{color:var(--acc)}
.intro{font-size:15px;line-height:1.5;color:var(--muted);text-align:center;margin:0 0 22px}
#msgs{display:none;flex:1;min-height:0;overflow:auto;padding:8px 2px 14px;flex-direction:column;gap:12px;overscroll-behavior:contain}
.msg{max-width:90%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55}
.msg.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.msg.user{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg.user img{display:block;max-width:100%;max-height:200px;border-radius:12px;margin:2px 0 6px}
.msg.user .fl{font-size:13px;opacity:.95;margin-bottom:4px;overflow-wrap:anywhere}
.msg.err{border-color:#e5484d;font-size:13px}
.msg .tools{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.tools button{border:0;background:none;color:var(--muted);font:500 12.5px "Outfit",system-ui,sans-serif;cursor:pointer;padding:4px 8px;border-radius:8px}
.tools button:hover{background:var(--tint);color:var(--text)}
.tools button:disabled{cursor:default;opacity:.6}
.tools .fbd{font-size:12.5px;color:var(--acc);padding:4px 8px}
.msg .retry{color:#d04444}
.vf{font-size:12px;color:var(--acc);margin-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opts button{border:1px solid var(--line);background:var(--card);color:var(--text);font:500 13px "Outfit",system-ui,sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer}
.opts button:hover{background:var(--tint)}
.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px 12px 8px 16px;min-height:108px;display:flex;flex-direction:column}
.card:focus-within{border-color:var(--acc)}
textarea:focus,textarea:focus-visible{outline:none;box-shadow:none}
/* 16px: iPhone par focus karte hi page zoom na ho */
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:400 16px/1.5 "Outfit",system-ui,sans-serif;min-height:48px;max-height:200px;padding:0}
textarea::placeholder{color:var(--muted)}
.row{display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-top:6px}
.circle{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.circle svg{width:20px;height:20px}
#mic{background:none;color:var(--text)}
#mic.on{background:var(--tint);color:var(--acc)}
#send,#stop{background:var(--acc);color:#fff}
#send{display:none}
#stop{display:none;background:#b4232d}
#send:disabled,#stop:disabled{opacity:.5}
#plusWrap{position:relative;margin-right:auto}
#plus{background:none;color:var(--text)}
#plus:hover,#plus.on{background:var(--tint)}
.has-text #send{display:grid}.has-text #mic{display:none}
.busy #stop{display:grid}.busy #send{display:none}.busy #mic{display:none}
.menu{display:none;position:absolute;left:0;bottom:calc(100% + 8px);min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px -12px rgba(0,0,0,.3);z-index:10}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--text);font:500 15px "Outfit",system-ui,sans-serif;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--tint)}
.menu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=file]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 8px}
.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:6px;max-width:100%;background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 4px;font-size:13px}
.chip img{width:36px;height:36px;object-fit:cover;border-radius:8px;display:block}
.chip .ic{width:36px;height:36px;display:grid;place-items:center;font-size:18px}
.chip .nm{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;width:24px;height:24px;border-radius:50%;cursor:pointer}
.note{font-size:13px;color:#e5484d;padding:0 6px 8px;display:none}
.note.show{display:block}
.chatting #body{justify-content:flex-start}
.chatting h1,.chatting .intro,.chatting .sugg{display:none}
.chatting #msgs{display:flex}
.chatting .card{min-height:0;margin-bottom:calc(10px + env(safe-area-inset-bottom,0px));flex-direction:row;flex-wrap:wrap;align-items:flex-end;padding:6px;gap:4px}
.chatting .chips{order:-1;flex-basis:100%;padding:4px 6px}
.chatting .row{display:contents}
.chatting #plusWrap{order:0;margin-right:0}
.chatting textarea{order:1;flex:1;min-width:0;min-height:24px;padding:8px 0}
.chatting #mic{order:2}
.chatting #send,.chatting #stop{order:3}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
.sugg button{border:1px solid var(--line);background:var(--card);color:var(--text);font:500 13.5px "Outfit",system-ui,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;text-align:left;line-height:1.3}
.sugg button:hover{background:var(--tint);border-color:var(--acc)}
.thinking{background:none!important;border:0!important;padding:4px 0!important;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.thinking .dot{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;animation:pulse 1.4s ease-in-out infinite}
.thinking .t{color:var(--muted)}
.legal{max-width:640px;margin:0 auto;padding:0 16px 8px;text-align:center;color:var(--muted);font-size:11px;line-height:1.4}
@keyframes pulse{50%{transform:scale(.85);opacity:.7}}
/* input neeche, ek line ka pill */
#body{justify-content:flex-end}
.chatting #body{justify-content:flex-start}
.card{min-height:0;border-radius:28px;margin-bottom:10px;flex-direction:row;flex-wrap:wrap;align-items:flex-end;padding:6px;gap:4px}
.chips{order:-1;flex-basis:100%;padding:4px 6px}
.row{display:contents}
#plusWrap{order:0;margin-right:0}
textarea{order:1;flex:1;min-width:0;min-height:24px;padding:8px 0}
#mic{order:2}
#send,#stop{order:3}
#send{display:grid;opacity:.4}
.has-text #send{opacity:1}
.has-text #mic{display:grid}
.busy #send,.busy #mic{display:none}
.chatting .card{margin-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
/* attach menu: gol icons */
.menu{min-width:190px;padding:8px;border-radius:20px}
.menu button{gap:14px;padding:6px 10px}
.menu svg{width:44px;height:44px;padding:11px;border-radius:50%;background:var(--tint)}
@media(max-width:420px){.top{padding:4px 8px}#body{padding:0 10px}.msg{max-width:94%;font-size:14.5px}.card{padding-left:12px}.sugg button{font-size:12.5px;padding:8px 11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}.thinking .dot{animation:none}}
/* smooth click animation */
button{transition:transform .16s cubic-bezier(.3,.7,.4,1),background-color .22s ease,color .22s ease,opacity .22s ease,border-color .22s ease,box-shadow .22s ease;-webkit-tap-highlight-color:transparent}
button:active:not(:disabled){transform:scale(.9)}
.sugg button:active,.opts button:active,.menu button:active,.tools button:active{transform:scale(.96)}
.card{transition:border-color .25s ease,box-shadow .25s ease}
.card:focus-within{box-shadow:0 0 0 4px var(--tint)}
.menu.open{animation:pop .18s cubic-bezier(.2,.8,.3,1);transform-origin:bottom left}
.msg{animation:rise .28s ease both}
#mic.on{animation:micp 1.2s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 var(--tint)}50%{box-shadow:0 0 0 9px transparent}}
@media(prefers-reduced-motion:reduce){button:active:not(:disabled){transform:none}.msg,.menu.open,#mic.on{animation:none}}
/* + dabane par x ban jaye */
#plus svg{transition:transform .28s cubic-bezier(.3,.7,.4,1)}
#plus.on svg{transform:rotate(45deg)}
/* jawab ka naya rup: tables, bade numbers, PDF/CSV */
.msg .num{font-weight:600;color:var(--acc)}
.msg strong{font-weight:600}
.tw{overflow-x:auto;margin:8px 0;white-space:normal;border:1px solid var(--line);border-radius:12px}
.tw table{border-collapse:collapse;width:100%;font-size:13.5px}
.tw th,.tw td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tw th{background:var(--tint);font-weight:600}
.tw tr:last-child td{border-bottom:0}
/* hisaab ka card + slider */
.calc{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);white-space:normal}
.calc .ct{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-width:0}
.cd small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.cd b{display:block;margin-top:2px;font-size:15px;font-weight:600;color:var(--acc);overflow-wrap:anywhere}
.cd.main{border-color:var(--acc);background:var(--tint)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s ease}
.bar i+i{background:var(--warm)}
.lg{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.sl{margin-top:10px}
.sl .lr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.sl .lr b{font-weight:600;color:var(--text)}
.sl input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--acc);height:28px;background:none;touch-action:pan-y}
@media(max-width:420px){.cd b{font-size:13.5px}.cd small{font-size:11px}}
@media print{body *{visibility:hidden}.print-me,.print-me *{visibility:visible}.print-me{position:absolute;left:0;top:0;width:100%;max-width:none;border:0;color:#000;background:#fff;animation:none}.print-me .tools,.print-me .opts,.print-me .vf,.print-me .sl{display:none}html,body,#app,#body,#msgs{height:auto!important;overflow:visible!important}.print-me::before{content:"Rupeyantra AI";display:block;font-weight:700;margin-bottom:8px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="ib" id="newChat" aria-label="Naya chat" title="Naya chat">
      <svg viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 3.6a1.9 1.9 0 0 1 2.7 2.7L12 15.4l-3.8 1 1-3.8z"/></svg>
    </button>
  </div>
  <main id="body">
    <div id="sugg" hidden></div>
    <div id="msgs" aria-live="polite" aria-relevant="additions text"></div>
    <div id="dock">
      <div id="note" class="note" role="status" aria-live="polite"></div>
      <form class="card" id="form">
        <div class="chips" id="chips"></div>
        <textarea id="inp" rows="1" maxlength="4000" placeholder="Kuch bhi poochho…" aria-label="Apna sawal" autocomplete="off"></textarea>
        <div class="row">
          <div id="plusWrap">
            <button type="button" class="circle" id="plus" aria-label="Photo ya file jodo" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="menu" id="menu" role="menu">
              <button type="button" id="pickPhoto" role="menuitem"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/></svg>Photos</button>
              <button type="button" id="pickFile" role="menuitem"><svg viewBox="0 0 24 24"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15 7"/></svg>Files</button>
            </div>
          </div>
          <button type="button" class="circle" id="mic" aria-label="Bolkar poochho" title="Bolkar poochho"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
          <button type="button" class="circle" id="stop" aria-label="Response roko" title="Response roko"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
          <button type="submit" class="circle" id="send" aria-label="Bhejo" title="Bhejo"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </form>
      <input type="file" id="imgIn" accept="image/*" multiple>
      <input type="file" id="fileIn" accept=".pdf,.txt,.csv,.tsv,.json,.md,.log,application/pdf,text/plain" multiple>
    </div>
  </main>
  <footer class="legal">General jaankari, financial advice nahi.</footer>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const app=$('app'),msgs=$('msgs'),inp=$('inp'),stopBtn=$('stop'),form=$('form'),mic=$('mic'),sugg=$('sugg');
const plus=$('plus'),menu=$('menu'),imgIn=$('imgIn'),fileIn=$('fileIn'),chips=$('chips'),note=$('note');
const DEBUG=/[?&]debug=1/.test(location.search); // /ai?debug=1 par provider ke asli errors dikhte hain
const API='/api/chat';
// convo = API ko jaane wale messages; log = screen par dikhne wale messages
let convo=[],pending=[],log=[],gen=0,controller=null,activeBot=null,busy=false,noteTimer=null,rec=null,stopped=false,lastUserEl=null,lastDraft='';
// Limits backend (api/chat.js) se match karti hain: content 12000, base64 total 3.5M, Vercel body 4.5 MB
const MAX_FILES=3,MAX_B64=2700000,MAX_TOTAL_B64=3300000,MAX_PDF=2000000,MAX_CONTENT=12000,TEXT_PER_FILE=8000,MAX_TEXT_FILE=500000,REQUEST_TIMEOUT=55000;
const KEY='rupeyantra_chat_v2',DB_NAME='rupeyantra_ai_files',DB_STORE='sessions',FB_KEY='rupeyantra_feedback_v1';
const TEXT_EXT=/\.(txt|csv|tsv|json|md|log)$/i;
const FILE_BLOCK=/\[FILE: [^\]\n]{0,120}\][\s\S]*?(?:\[FILE END\]|$)/g; // text file ka content phone mein save nahi hota
const SUGG=['EMI kaise nikalte hain?','50 lakh ka home loan 8.5% par 20 saal ke liye EMI kitni hogi?','Mahine ki 5000 ki SIP 12% par 10 saal mein kitni banegi?','Mahine ka budget kaise banaye?'];

function refresh(){form.classList.toggle('has-text',inp.value.trim().length>0||pending.length>0)}
function grow(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,200)+'px';refresh()}
function setBusy(b){busy=b;form.classList.toggle('busy',b)}
function warn(t){note.textContent=t;note.classList.add('show');clearTimeout(noteTimer);noteTimer=setTimeout(()=>note.classList.remove('show'),6000)}
inp.addEventListener('input',grow);
inp.addEventListener('keydown',e=>{const touch=window.matchMedia&&matchMedia('(pointer:coarse)').matches;if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!touch){e.preventDefault();form.requestSubmit()}});
inp.addEventListener('paste',e=>{const f=Array.from((e.clipboardData&&e.clipboardData.files)||[]).filter(x=>x.type.startsWith('image/'));if(f.length){e.preventDefault();addFiles(f)}});

/* menu */
function closeMenu(){menu.classList.remove('open');plus.classList.remove('on');plus.setAttribute('aria-expanded','false')}
plus.onclick=e=>{e.stopPropagation();const o=menu.classList.toggle('open');plus.classList.toggle('on',o);plus.setAttribute('aria-expanded',String(o))};
document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!plus.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
$('pickPhoto').onclick=()=>{closeMenu();imgIn.click()};
$('pickFile').onclick=()=>{closeMenu();fileIn.click()};
imgIn.onchange=()=>{const f=Array.from(imgIn.files);imgIn.value='';addFiles(f)};
fileIn.onchange=()=>{const f=Array.from(fileIn.files);fileIn.value='';addFiles(f)};

/* storage: chat IndexedDB mein, fallback localStorage */
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB unavailable'));return}const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPut(value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(value,KEY);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function dbGet(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly'),r=tx.objectStore(DB_STORE).get(KEY);r.onsuccess=()=>{db.close();resolve(r.result||null)};r.onerror=()=>{db.close();reject(r.error)}})}
async function dbDelete(){try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(_){}}
let saveQueue=Promise.resolve();
function save(){
  // Photo/PDF ka base64 aur text file ka content kabhi save nahi hota; sirf sawal/jawab ka text aur chhota thumbnail.
  const clean=t=>String(t||'').replace(FILE_BLOCK,'[file ka content save nahi kiya]');
  const snap={log:log.slice(-60),history:convo.slice(-40).map(m=>({role:m.role,content:clean(m.content)})),savedAt:Date.now()};
  saveQueue=saveQueue.then(()=>dbPut(snap)).catch(()=>{
    try{localStorage.setItem(KEY,JSON.stringify({log:snap.log.slice(-30).map(l=>({role:l.role,text:l.text,atts:(l.atts||[]).map(a=>({name:a.name,thumb:null}))})),history:snap.history.slice(-20)}))}catch(_){}
  });
}

function botMsg(bot,text,animate,extra){
  bot.classList.remove('thinking','err');bot.innerHTML='';
  const span=document.createElement('span');bot.appendChild(span);
  const tools=document.createElement('div');tools.className='tools';
  const cb=document.createElement('button');cb.type='button';cb.textContent='Copy';cb.onclick=()=>copyText(text,cb);tools.appendChild(cb);

  const finish=()=>{
    if(!bot.isConnected)return;
    renderRich(span,text);
    if(extra&&extra.calc){try{bot.appendChild(buildCalc(extra.calc))}catch(_){}}
    addExtra(tools,bot,span);
    if(extra&&extra.q!==undefined)addFeedback(tools,extra.q,text);
    if(extra&&extra.verified){const v=document.createElement('div');v.className='vf';v.textContent='✓ Calculator se verified';bot.appendChild(v)}
    bot.appendChild(tools);
    if(extra&&Array.isArray(extra.options)&&extra.options.length){
      const o=document.createElement('div');o.className='opts';
      extra.options.slice(0,6).forEach(t=>{
        if(typeof t!=='string'||!t)return;
        const b=document.createElement('button');b.type='button';b.textContent=t;
        b.onclick=()=>{if(busy)return;o.remove();inp.value=t;grow();form.requestSubmit()};
        o.appendChild(b);
      });
      if(o.children.length)bot.appendChild(o);
    }
    msgs.scrollTop=msgs.scrollHeight;
  };
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!animate||reduce||text.length<40){finish();return}
  const my=gen;let i=0;const step=Math.max(3,Math.ceil(text.length/90));
  const timer=setInterval(()=>{
    // naya message ya naya chat aaya to animation rok kar poora text dikha do (adhura text na rahe)
    if(my!==gen||!bot.isConnected){clearInterval(timer);finish();return}
    i+=step;
    if(i>=text.length){clearInterval(timer);finish();return}
    span.textContent=text.slice(0,i);msgs.scrollTop=msgs.scrollHeight;
  },18);
}

/* rich jawab: table, bold, bade rupaye ke numbers (sirf dikhawat, connection nahi) */
function numify(p,s){s.split(/(₹\s?[\d,]+(?:\.\d+)?(?:\s?(?:lakh|crore|Lakh|Crore|L|Cr)\b)?)/).forEach((t,i)=>{if(!t)return;if(i%2){const n=document.createElement('span');n.className='num';n.textContent=t;p.appendChild(n)}else p.appendChild(document.createTextNode(t))})}
function inl(p,s){s.split(/(\*\*[^*\n]+\*\*)/).forEach(part=>{if(/^\*\*[^*]+\*\*$/.test(part)){const b=document.createElement('strong');numify(b,part.slice(2,-2));p.appendChild(b)}else numify(p,part)})}
const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
function renderRich(el,text){
  el.textContent='';const L=text.split('\n');let buf=[];
  const flush=()=>{if(buf.length){const d=document.createElement('div');inl(d,buf.join('\n'));el.appendChild(d);buf=[]}};
  for(let i=0;i<L.length;i++){
    if(isRow(L[i])&&i+1<L.length&&isSep(L[i+1])){
      flush();
      const t=document.createElement('table'),th=document.createElement('thead'),tb=document.createElement('tbody'),hr=document.createElement('tr');
      cells(L[i]).forEach(c=>{const x=document.createElement('th');inl(x,c);hr.appendChild(x)});th.appendChild(hr);
      i+=2;
      while(i<L.length&&isRow(L[i])){const r=document.createElement('tr');cells(L[i]).forEach(c=>{const x=document.createElement('td');inl(x,c);r.appendChild(x)});tb.appendChild(r);i++}
      i--;t.appendChild(th);t.appendChild(tb);
      const w=document.createElement('div');w.className='tw';w.appendChild(t);el.appendChild(w);
    }else buf.push(L[i]);
  }
  flush();
}
function addExtra(tools,bot,span){

/* hisaab ka card + slider: sawal se rakam, byaj aur saal nikalkar EMI/SIP khud calculate karta hai */
const UNIT={lakh:1e5,lac:1e5,l:1e5,crore:1e7,cr:1e7,hazaar:1e3,hazar:1e3,thousand:1e3,k:1e3};
function parseCalc(raw){
  const t=String(raw||'').replace(FILE_BLOCK,' ').replace(/,/g,'');
  const low=t.toLowerCase();
  const isSip=/\bsip\b/.test(low);
  const isEmi=!isSip&&(/\bemi\b|loan|लोन|कर्ज/.test(low));
  if(!isSip&&!isEmi)return null;
  let rest=low;
  const rm=rest.match(/(\d+(?:\.\d+)?)\s*(?:%|percent|pratishat|प्रतिशत)/);
  const ym=rest.match(/(\d+(?:\.\d+)?)\s*(saal|sal|year|years|yr|yrs|varsh|साल|mahine|mahina|month|months|महीने)/);
  if(!rm||!ym)return null;
  rest=rest.replace(rm[0],' ').replace(ym[0],' ');
  const am=rest.match(/(\d+(?:\.\d+)?)\s*(lakh|lac|crore|cr|hazaar|hazar|thousand|k|l)?(?![a-z])/);
  if(!am)return null;
  const a=parseFloat(am[1])*(am[2]?UNIT[am[2]]:1);
  const r=parseFloat(rm[1]);
  let y=parseFloat(ym[1]);
  if(/^(mahine|mahina|month|months|महीने)$/.test(ym[2]))y=y/12;
  if(!(a>0)||!(r>0)||r>60||!(y>0)||y>50)return null;
  return {type:isSip?'sip':'emi',a,r,y:Math.round(y*2)/2||0.5};
}
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
function inrS(n){n=Math.round(n);if(n>=1e7)return '₹'+(n/1e7).toFixed(2)+' Cr';if(n>=1e5)return '₹'+(n/1e5).toFixed(2)+' L';return inr(n)}
function calcOut(type,a,r,y){
  const n=Math.round(y*12),i=r/1200;
  if(type==='emi'){
    const emi=i?a*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1):a/n;
    const tot=emi*n;return {c:[emi,tot-a,tot],p:a,q:tot-a};
  }
  const fv=i?a*((Math.pow(1+i,n)-1)/i)*(1+i):a*n;
  const inv=a*n;return {c:[inv,fv-inv,fv],p:inv,q:fv-inv};
}
function buildCalc(c){
  const isE=c.type==='emi';
  const T=isE?['Mahine ki EMI','Kul byaj','Kul rakam']:['Aapne lagaya','Anumani returns','Anumani value'];
  const LG=isE?['Mool dhan','Byaj']:['Lagaya','Returns'];
  const st={a:c.a,r:c.r,y:c.y};
  const w=document.createElement('div');w.className='calc';
  const ct=document.createElement('div');ct.className='ct';
  ct.textContent=(isE?'EMI hisaab':'SIP hisaab')+' – slider khiskakar badal ke dekho';w.appendChild(ct);
  const cd=document.createElement('div');cd.className='cards';
  const vals=T.map((t,k)=>{const d=document.createElement('div');d.className='cd'+(k===0?' main':'');const s=document.createElement('small');s.textContent=t;const b=document.createElement('b');d.appendChild(s);d.appendChild(b);cd.appendChild(d);return b});
  w.appendChild(cd);
  const bar=document.createElement('div');bar.className='bar';const b1=document.createElement('i'),b2=document.createElement('i');bar.appendChild(b1);bar.appendChild(b2);w.appendChild(bar);
  const lg=document.createElement('div');lg.className='lg';const l1=document.createElement('span'),l2=document.createElement('span');lg.appendChild(l1);lg.appendChild(l2);w.appendChild(lg);
  const upd=()=>{
    const o=calcOut(c.type,st.a,st.r,st.y);
    o.c.forEach((v,k)=>{vals[k].textContent=inrS(v)});
    const tot=o.p+o.q||1;
    b1.style.width=(o.p/tot*100).toFixed(1)+'%';b2.style.width=(o.q/tot*100).toFixed(1)+'%';
    l1.textContent=LG[0]+' '+Math.round(o.p/tot*100)+'%';l2.textContent=LG[1]+' '+Math.round(o.q/tot*100)+'%';
  };
  const rows=[
    ['a',isE?'Loan rakam':'Mahine ki SIP',Math.min(isE?100000:500,c.a),Math.max(isE?50000000:100000,Math.ceil(c.a*2)),isE?10000:500,v=>inr(v)],
    ['r',isE?'Byaj dar (saal ka)':'Anumani return (saal ka)',Math.min(1,c.r),Math.max(isE?20:30,Math.ceil(c.r)),0.1,v=>v.toFixed(1)+'%'],
    ['y','Samay',0.5,Math.max(isE?30:40,Math.ceil(c.y)),0.5,v=>(v%1?v.toFixed(1):v)+' saal']
  ];
  rows.forEach(([k,lab,min,max,step,f])=>{
    const s=document.createElement('div');s.className='sl';
    const lr=document.createElement('div');lr.className='lr';
    const ls=document.createElement('span');ls.textContent=lab;const lv=document.createElement('b');lv.textContent=f(st[k]);
    lr.appendChild(ls);lr.appendChild(lv);s.appendChild(lr);
    const rg=document.createElement('input');rg.type='range';rg.min=min;rg.max=max;rg.step=step;rg.value=st[k];rg.setAttribute('aria-label',lab);
    rg.oninput=()=>{st[k]=parseFloat(rg.value);lv.textContent=f(st[k]);upd()};
    s.appendChild(rg);w.appendChild(s);
  });
  upd();
  return w;
}

/* attachments */
function readDataURL(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('File padh nahi payi'));r.readAsDataURL(f)})}
function readText(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('File padh nahi payi'));r.readAsText(f)})}
function loadImage(url){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error('Is photo ka format support nahi hai'));im.src=url})}
function drawScaled(im,max,q){
  const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  return c.toDataURL('image/jpeg',q);
}
const b64Of=u=>u.split(',')[1]||'';
const pendingB64=()=>pending.reduce((n,p)=>n+(p.data?p.data.length:0),0);

// Photo ko chhota karke JPEG banata hai taaki upload size limit mein rahe.
async function prepareImage(f){
  const url=await readDataURL(f);
  const im=await loadImage(url);
  const room=Math.min(MAX_B64,MAX_TOTAL_B64-pendingB64());
  for(const [max,q] of [[1600,.82],[1280,.78],[1024,.72],[800,.65]]){
    const data=b64Of(drawScaled(im,max,q));
    if(data.length&&data.length<=room){
      return {kind:'image',name:f.name||'photo.jpg',mime:'image/jpeg',data,thumb:drawScaled(im,120,.7)};
    }
  }
  throw new Error('Photo bahut badi hai; chhoti photo bhejo');
}
async function preparePdf(f){
  if(f.size>MAX_PDF)throw new Error('PDF 2 MB se chhoti honi chahiye');
  const data=b64Of(await readDataURL(f));
  if(!data||data.length>MAX_TOTAL_B64-pendingB64())throw new Error('Files ka total size bahut zyada hai');
  return {kind:'pdf',name:f.name||'file.pdf',mime:'application/pdf',data,thumb:null};
}
async function prepareText(f){
  if(f.size>MAX_TEXT_FILE)throw new Error('Text file bahut badi hai');
  const text=(await readText(f)).replace(/\u0000/g,'').trim();
  if(!text)throw new Error('File khali hai');
  return {kind:'text',name:f.name||'file.txt',text:text.slice(0,TEXT_PER_FILE),thumb:null};
}
async function addFiles(files){
  for(const f of files){
    if(pending.length>=MAX_FILES){warn('Ek baar mein sirf '+MAX_FILES+' files jod sakte hain.');break}
    try{
      let item;
      if(f.type.startsWith('image/'))item=await prepareImage(f);
      else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))item=await preparePdf(f);
      else if(f.type.startsWith('text/')||f.type==='application/json'||TEXT_EXT.test(f.name))item=await prepareText(f);
      else throw new Error('Ye file type support nahi hai (photo, PDF ya text file bhejo)');
      pending.push(item);
    }catch(e){warn((f.name?f.name+': ':'')+(e.message||'File jod nahi payi'))}
  }
  renderChips();
}
function renderChips(){
  chips.innerHTML='';
  pending.forEach((p,idx)=>{
    const c=document.createElement('div');c.className='chip';
    if(p.thumb){const im=document.createElement('img');im.src=p.thumb;im.alt='';c.appendChild(im)}

    x.onclick=()=>{pending.splice(idx,1);renderChips()};
    c.appendChild(x);chips.appendChild(c);
  });

}

// Text files ka content message ke saath [FILE: naam] ... [FILE END] block mein jaata hai (backend inhe calculation se alag rakhta hai).
function buildContent(text){
  const blocks=pending.filter(p=>p.kind==='text').map(p=>'[FILE: '+p.name.replace(/[\]\n\r]/g,' ').slice(0,100)+']\n'+p.text+'\n[FILE END]');
  if(!blocks.length)return text;
  const head=text||'Is file ko dekho aur batao isme kya hai.';
  return (head+'\n\n'+blocks.join('\n\n')).slice(0,MAX_CONTENT);
}

/* send */
async function send(){
  const my=++gen;
  stopped=false;
  controller=new AbortController();
  const bot=thinkingBot();activeBot=bot;setBusy(true);
  let timedOut=false,serverData={};
  const timer=setTimeout(()=>{timedOut=true;controller.abort()},REQUEST_TIMEOUT);
  try{
    const last=convo.length-1;
    const payload=convo.map((m,i)=>{const o={role:m.role,content:m.content};if(i===last&&m.attachments)o.attachments=m.attachments;return o});
    const question=convo.length&&convo[last].role==='user'?String(convo[last].content||''):'';
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:payload}),signal:controller.signal});
    try{serverData=await r.json()}catch(_){}
    if(my!==gen)return;
    const reply=serverData&&typeof serverData.reply==='string'?serverData.reply.trim():'';
    if(!r.ok||!reply){
      const e=new Error((serverData&&serverData.message)||'Abhi jawab nahi mil paya. Dobara try karein.');
      e.fromServer=true;throw e;
    }
    setBusy(false);
    lastUserEl=null;
    convo.push({role:'assistant',content:reply});
    log.push({role:'bot',text:reply});
    save();
    let calc=null;try{calc=parseCalc(question)}catch(_){}
    botMsg(bot,reply,true,{verified:serverData.verified===true,options:serverData.options,calc,q:question});
  }catch(e){
    if(stopped||my!==gen)return;
    let msg=e&&e.fromServer?e.message:timedOut?'Jawab dene mein der lag gayi. Dobara try karein.':'Internet check karke dobara try karein.';
    if(DEBUG){msg+='\n['+(e&&e.message||'')+']'+(serverData&&serverData.debug?'\n'+JSON.stringify(serverData.debug):'')}
    setBusy(false);
    showError(bot,msg,()=>{if(busy)return;bot.remove();send()});
  }finally{
    clearTimeout(timer);
    if(my===gen&&busy)setBusy(false);
  }
}

  pending=[];renderChips();

  if(rec){try{rec.stop()}catch(_){}}

});

else{

    r.lang='hi-IN';r.interimResults=false;r.continuous=false;
    r.onresult=ev=>{
      const t=Array.from(ev.results).map(x=>x[0].transcript).join(' ').trim();
      if(t){inp.value=(inp.value?inp.value+' ':'')+t;grow()}
    };
    r.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')warn('Mic use karne ki permission do.');else if(ev.error!=='no-speech'&&ev.error!=='aborted')warn('Awaaz samajh nahi aayi, dobara try karein.')};
    r.onend=()=>{rec=null;mic.classList.remove('on')};
    rec=r;mic.classList.add('on');
    try{r.start()}catch(_){rec=null;mic.classList.remove('on')}
  };
}

/* pichhla chat wapas laao */
async function restore(){
  let snap=null;
  try{snap=await dbGet()}catch(_){}
  if(!snap){try{snap=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}}
  if(!snap||!Array.isArray(snap.log)||!snap.log.length)return;
  log=snap.log.filter(l=>l&&(l.role==='user'||l.role==='bot')&&typeof l.text==='string');
  convo=Array.isArray(snap.history)?snap.history.filter(m=>m&&(m.role==='user'||m.role==='assistant')&&typeof m.content==='string'):[];
  if(!log.length)return;
  app.classList.add('chatting');
  log.forEach(l=>{if(l.role==='user')addUser(l.text,Array.isArray(l.atts)?l.atts:[]);else botMsg(add('bot',''),l.text,false)});
}
restore().catch(()=>{});
grow();
