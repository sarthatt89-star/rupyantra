<!DOCTYPE html>
<html lang="en-IN">
<head>

<meta property="og:url" content="https://rupyantra-psi.vercel.app/ai">

{"@context":"https://schema.org","@type":"WebApplication","name":"Rupeyantra AI","url":"https://rupyantra-psi.vercel.app/ai","applicationCategory":"FinanceApplication","operatingSystem":"Web","inLanguage":"en-IN","description":"AI assistant for understanding EMI, SIP, loans, budgeting and savings in Hinglish.","offers":{"@type":"Offer","price":"0","priceCurrency":"INR"}}
</script>
<style>
:root{color-scheme:light dark;--bg:#F6FAF8;--text:#14282B;--muted:#6B7C80;--line:#DDE7E3;--card:#fff;--acc:#0F9D6E;--tint:rgba(15,157,110,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#0D1618;--text:#E6EFEC;--muted:#8DA19D;--line:#233436;--card:#142123;--acc:#2BC58F;--tint:rgba(43,197,143,.14)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,textarea,input{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .16s,background-color .22s,color .22s,opacity .22s}
button:active:not(:disabled){transform:scale(.93)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{height:100%;min-height:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;justify-content:flex-end;padding:6px 12px}
.ib{width:40px;height:40px;border:0;background:none;color:var(--text);display:grid;place-items:center;border-radius:12px;cursor:pointer}
.ib:hover{background:var(--tint)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;width:100%;max-width:680px;margin:0 auto;padding:0 16px}
h1{font-size:clamp(22px,6vw,30px);line-height:1.25;font-weight:600;text-align:center;margin:0 0 8px}
h1 span{color:var(--acc)}
.intro{font-size:15px;line-height:1.5;color:var(--muted);text-align:center;margin:0 0 18px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px}
.sugg button{border:1px solid var(--line);background:var(--card);color:var(--text);font:500 13.5px "Outfit",system-ui,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;line-height:1.3}
.sugg button:hover{background:var(--tint);border-color:var(--acc)}
#apps button{border-color:var(--acc);font-weight:600}
#msgs{display:none;flex:1;min-height:0;overflow:auto;padding:8px 2px 14px;flex-direction:column;gap:12px;overscroll-behavior:contain}
.chatting #body{justify-content:flex-start}
.chatting h1,.chatting .intro,.chatting .sugg{display:none}
.chatting #msgs{display:flex}
.msg{max-width:92%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55;animation:rise .28s ease both}
.msg.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.msg.user{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg.user img{display:block;max-width:100%;max-height:200px;border-radius:12px;margin:2px 0 6px}
.msg.user .fl{font-size:13px;margin-bottom:4px}
.msg.err{border-color:#e5484d;font-size:13px}
.msg .num{font-weight:600;color:var(--acc)}
.msg strong{font-weight:600}
.tools{display:flex;gap:2px;margin-top:7px;flex-wrap:wrap;white-space:normal}
.tools button{border:0;background:none;color:var(--muted);font:500 12.5px "Outfit",system-ui,sans-serif;cursor:pointer;padding:4px 7px;border-radius:8px}
.tools button:hover,.tools button.on{background:var(--tint);color:var(--text)}
.retry{color:#d04444!important}
.vf{font-size:12px;color:var(--acc);margin-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opts button{border:1px solid var(--line);background:var(--card);color:var(--text);font:500 13px "Outfit",system-ui,sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer}
.tw{overflow-x:auto;margin:8px 0;white-space:normal;border:1px solid var(--line);border-radius:12px}
.tw table{border-collapse:collapse;width:100%;font-size:13.5px}
.tw th,.tw td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tw th{background:var(--tint);font-weight:600}
.tw tr:last-child td{border-bottom:0}
/* code card */
.code{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;white-space:normal}
.code .h{display:flex;align-items:center;gap:2px;padding:4px 6px 4px 12px;background:var(--tint);font-size:12.5px;font-weight:600}
.code .h span{margin-right:auto}
.code .h button{border:0;background:none;color:var(--text);font:500 12.5px "Outfit",sans-serif;padding:4px 8px;border-radius:8px;cursor:pointer}
.code .h button:hover{background:var(--line)}
.code pre{margin:0;padding:10px 12px;overflow:auto;max-height:280px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.code iframe{display:block;width:100%;height:240px;border:0;border-top:1px solid var(--line);background:#fff}
/* mini-app card */
.msg.tool{white-space:normal;width:100%;max-width:100%}
.tool>b{font-size:16px}
.tf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.tf label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.tf input{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 10px;font-size:16px;width:100%}
.big{font-size:26px;font-weight:700;color:var(--acc);margin:6px 0}
.big small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
.pie{display:flex;align-items:center;gap:14px;margin:8px 0}
.pie svg{width:110px;height:110px;flex:none}
.pie .lg{font-size:13px;display:grid;gap:4px}
.pie i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.ln{width:100%;height:110px;margin:8px 0;background:var(--bg);border-radius:10px}
.lgd{font-size:12px;color:var(--muted)}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px;margin:8px 0;padding:6px 4px 0;background:var(--bg);border-radius:10px}
.bars .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11.5px;text-align:center}
.bars .b span{display:block;width:70%;border-radius:6px 6px 0 0;min-height:2px}
.bars .b small{color:var(--muted)}
.thinking{background:none!important;border:0!important;padding:4px 0!important;display:flex;align-items:center;gap:10px;font-weight:600}
.thinking .dot{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;animation:pulse 1.4s ease-in-out infinite}
.thinking .t{color:var(--muted)}
.note{font-size:13px;color:#e5484d;padding:0 6px 8px;display:none}
.note.show{display:block}
/* input bar: upar sawal, neeche Image | File | Text; + dabane par 3 aur vikalp upar ki taraf */
.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:28px;margin-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px;transition:border-color .25s,box-shadow .25s}
.card:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--tint)}
.bar{display:flex;align-items:center;gap:2px}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
textarea{width:100%;min-height:24px;max-height:160px;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:400 16px/1.5 "Outfit",system-ui,sans-serif;padding:6px 0}
textarea::placeholder{color:var(--muted);font-size:15px;transition:opacity .3s}
textarea:focus,textarea:focus-visible{outline:none!important;box-shadow:none!important}
.circle{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;background:none;color:var(--text)}
.circle svg{width:20px;height:20px}
#plus:hover,#plus.on{background:var(--tint)}
#plus svg{transition:transform .28s cubic-bezier(.3,.7,.4,1)}
#plus.on svg{transform:rotate(45deg)}
#mic.on{background:var(--tint);color:var(--acc);animation:micp 1.2s ease-in-out infinite}
#send{background:var(--acc);color:#fff;opacity:.4}
.has-text #send{opacity:1}
#stop{display:none;background:#b4232d;color:#fff}
.busy #stop{display:grid}.busy #send,.busy #mic{display:none}
.acts{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;margin-top:2px}
.acts::-webkit-scrollbar{display:none}
.acts button{display:flex;align-items:center;gap:6px;flex:none;border:0;background:none;color:var(--text);font:500 13.5px "Outfit",system-ui,sans-serif;padding:4px 9px;white-space:nowrap;cursor:pointer;border-radius:10px}
.acts button:hover{background:var(--tint)}
.acts button+button{border-left:1px solid var(--line);border-radius:0 10px 10px 0}
.acts button:first-child{padding-left:2px}
.acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* + ke vikalp: upar ki taraf */
.menu{display:none;position:absolute;left:8px;bottom:calc(100% + 8px);min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 10px 30px -12px rgba(0,0,0,.3);z-index:10}
.menu.open{display:block;animation:pop .18s cubic-bezier(.2,.8,.3,1);transform-origin:bottom left}
.menu>button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;color:var(--text);font:500 15px "Outfit",system-ui,sans-serif;padding:6px 10px;border-radius:14px;cursor:pointer;text-align:left}
.menu>button:hover{background:var(--tint)}
.menu>button svg{width:44px;height:44px;padding:11px;border-radius:50%;background:var(--tint);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.calcs{display:none;flex-wrap:wrap;gap:6px;padding:2px 6px 8px 64px}
.calcs.open{display:flex}
.calcs button{border:1px solid var(--line);background:var(--card);color:var(--text);font:500 13px "Outfit",system-ui,sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer}
.calcs button:hover{background:var(--tint);border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px 8px}
.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 4px;font-size:13px}
.chip img{width:36px;height:36px;object-fit:cover;border-radius:8px}
.chip .ic{width:36px;height:36px;display:grid;place-items:center;font-size:18px}
.chip .nm{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;color:var(--muted);font-size:18px;width:24px;height:24px;border-radius:50%;cursor:pointer}
input[type=file]{display:none}
.legal{max-width:640px;margin:0 auto;padding:0 16px 8px;text-align:center;color:var(--muted);font-size:11px}
@keyframes pulse{50%{transform:scale(.85);opacity:.7}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes micp{50%{box-shadow:0 0 0 9px transparent}}
@media(max-width:420px){.top{padding:4px 8px}#body{padding:0 10px}.msg{max-width:96%;font-size:14.5px}.sugg button{font-size:12.5px;padding:8px 11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{body *{visibility:hidden}.print-me,.print-me *{visibility:visible}.print-me{position:absolute;left:0;top:0;width:100%;max-width:none;border:0;color:#000;background:#fff;animation:none}.print-me .tools,.print-me .opts,.print-me .vf{display:none}html,body,#app,#body,#msgs{height:auto!important;overflow:visible!important}.print-me::before{content:"Rupeyantra AI";display:block;font-weight:700;margin-bottom:8px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="ib" id="newChat" aria-label="Naya chat" title="Naya chat"><svg class="i" viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 3.6a1.9 1.9 0 0 1 2.7 2.7L12 15.4l-3.8 1 1-3.8z"/></svg></button>
  </div>
  <main id="body">
    <div id="msgs" aria-live="polite" aria-relevant="additions text"></div>
    <div id="dock">
      <div id="note" class="note" role="status" aria-live="polite"></div>
      <form class="card" id="form">
        <div class="chips" id="chips"></div>
        <div class="bar">
          <button type="button" class="circle" id="plus" aria-label="Aur vikalp" aria-haspopup="true" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <div class="mid">
            <textarea id="inp" rows="1" maxlength="4000" placeholder="Ask about money…" aria-label="Ask a question" autocomplete="off"></textarea>
            <div class="acts">
              <button type="button" id="pickPhoto"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/></svg>Image</button>
              <button type="button" id="pickFile"><svg class="i" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>File</button>
              <button type="button" id="pickText"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Text</button>
            </div>
          </div>
          <button type="button" class="circle" id="mic" aria-label="Bolkar poochho" title="Bolkar poochho"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
          <button type="button" class="circle" id="stop" aria-label="Response roko" title="Response roko"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
          <button type="submit" class="circle" id="send" aria-label="Bhejo" title="Bhejo"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
        <div class="menu" id="menu" role="menu">
          <button type="button" id="pickCam" role="menuitem"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera</button>
          <button type="button" id="pickReport" role="menuitem"><svg class="i" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Report</button>
          <button type="button" id="pickCalc" role="menuitem" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/></svg>Calculators</button>
          <div class="calcs" id="calcs"></div>
        </div>
      </form>
      <input type="file" id="imgIn" accept="image/*" multiple>
      <input type="file" id="camIn" accept="image/*" capture="environment">
      <input type="file" id="fileIn" accept=".pdf,.txt,.csv,.tsv,.json,.md,.log,application/pdf,text/plain" multiple>
    </div>
  </main>
  <footer class="legal">General jaankari, financial advice nahi.</footer>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const app=$('app'),msgs=$('msgs'),inp=$('inp'),stopBtn=$('stop'),form=$('form'),mic=$('mic');
const plus=$('plus'),menu=$('menu'),calcs=$('calcs'),imgIn=$('imgIn'),camIn=$('camIn'),fileIn=$('fileIn'),chips=$('chips'),note=$('note');
const DEBUG=/[?&]debug=1/.test(location.search);
const API='/api/chat';
let convo=[],pending=[],log=[],gen=0,controller=null,activeBot=null,busy=false,noteTimer=null,rec=null,stopped=false,lastUserEl=null,lastDraft='',lastBot=null,speaking=null;
const MAX_FILES=3,MAX_B64=2700000,MAX_TOTAL_B64=3300000,MAX_PDF=2000000,MAX_CONTENT=12000,TEXT_PER_FILE=8000,MAX_TEXT_FILE=500000,REQUEST_TIMEOUT=55000;
const KEY='rupeyantra_chat_v2',DB_NAME='rupeyantra_ai_files',DB_STORE='sessions';
const TEXT_EXT=/\.(txt|csv|tsv|json|md|log)$/i;
const FILE_BLOCK=/\[FILE: [^\]\n]{0,120}\][\s\S]*?(?:\[FILE END\]|$)/g;

function refresh(){form.classList.toggle('has-text',inp.value.trim().length>0||pending.length>0)}
function grow(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,200)+'px';refresh()}
function setBusy(b){busy=b;form.classList.toggle('busy',b)}
function warn(t){note.textContent=t;note.classList.add('show');clearTimeout(noteTimer);noteTimer=setTimeout(()=>note.classList.remove('show'),6000)}
const down=()=>{msgs.scrollTop=msgs.scrollHeight};
inp.addEventListener('input',grow);
inp.addEventListener('keydown',e=>{const touch=window.matchMedia&&matchMedia('(pointer:coarse)').matches;if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!touch){e.preventDefault();form.requestSubmit()}});
inp.addEventListener('paste',e=>{const f=Array.from((e.clipboardData&&e.clipboardData.files)||[]).filter(x=>x.type.startsWith('image/'));if(f.length){e.preventDefault();addFiles(f)}});

/* + menu: 3 aur vikalp upar ki taraf */
function setOpen(o){menu.classList.toggle('open',o);plus.classList.toggle('on',o);plus.setAttribute('aria-expanded',String(o));if(!o){calcs.classList.remove('open');$('pickCalc').setAttribute('aria-expanded','false')}}
plus.onclick=e=>{e.stopPropagation();setOpen(!menu.classList.contains('open'))};
document.addEventListener('click',e=>{if(menu.classList.contains('open')&&!menu.contains(e.target)&&!plus.contains(e.target))setOpen(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
$('pickPhoto').onclick=()=>imgIn.click();
$('pickFile').onclick=()=>fileIn.click();
$('pickText').onclick=()=>{if(!inp.value.trim())inp.value='Is text ko samjhao:\n';grow();inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)};
$('pickCam').onclick=()=>{setOpen(false);camIn.click()};
$('pickReport').onclick=()=>{setOpen(false);inp.value='Is baatcheet ki ek chhoti report banao.';grow();inp.focus()};
$('pickCalc').onclick=e=>{e.stopPropagation();const o=calcs.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(o))};
[imgIn,camIn,fileIn].forEach(el=>el.onchange=()=>{const f=Array.from(el.files);el.value='';addFiles(f)});

/* storage */
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB unavailable'));return}const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPut(value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(value,KEY);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function dbGet(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly'),r=tx.objectStore(DB_STORE).get(KEY);r.onsuccess=()=>{db.close();resolve(r.result||null)};r.onerror=()=>{db.close();reject(r.error)}})}
async function dbDelete(){try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(_){}}
let saveQueue=Promise.resolve();
function save(){
  const clean=t=>String(t||'').replace(FILE_BLOCK,'[file ka content save nahi kiya]');
  const snap={log:log.slice(-60),history:convo.slice(-40).map(m=>({role:m.role,content:clean(m.content)})),savedAt:Date.now()};
  saveQueue=saveQueue.then(()=>dbPut(snap)).catch(()=>{
    try{localStorage.setItem(KEY,JSON.stringify({log:snap.log.slice(-30).map(l=>({role:l.role,text:l.text,atts:(l.atts||[]).map(a=>({name:a.name,thumb:null}))})),history:snap.history.slice(-20)}))}catch(_){}
  });
}
async function wipe(){try{await saveQueue}catch(_){}try{localStorage.removeItem(KEY);localStorage.removeItem('rupeyantra_chat_v1')}catch(_){}await dbDelete()}

/* downloads */
function dl(name,mime,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

function csvOf(tbl){const q=v=>'"'+v.replace(/"/g,'""')+'"';return '\ufeff'+Array.from(tbl.rows).map(r=>Array.from(r.cells).map(c=>q(c.textContent)).join(',')).join('\r\n')}
function printEl(el){
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';

  f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(_){window.print()}setTimeout(()=>f.remove(),60000)};

async function copyText(t,btn){
  let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(_){}ta.remove()}
  const old=btn.textContent;btn.textContent=ok?'Copy ho gaya ✓':'Copy nahi hua';setTimeout(()=>{if(btn.isConnected)btn.textContent=old},1800);
}
function mk(row,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>fn(b);row.appendChild(b);return b}
let speakId=0;
function speak(t,btn){
  const ss=window.speechSynthesis;if(!ss||!window.SpeechSynthesisUtterance){warn('Is browser mein sunna support nahi hai.');return}
  if(speaking===btn){speakId++;ss.cancel();speaking=null;btn.textContent='🔊 Suno';return}
  speakId++;ss.cancel();
  const id=speakId,parts=(t.replace(/[*|`#_]/g,' ').replace(/\s+/g,' ').match(/[^.!?।]+[.!?।]?/g)||[t]).map(x=>x.trim()).filter(Boolean).slice(0,40);
  const vs=ss.getVoices(),v=vs.find(x=>/^hi/i.test(x.lang))||vs.find(x=>/^en-IN/i.test(x.lang));
  speaking=btn;btn.textContent='⏹ Roko';
  let k=0;
  const next=()=>{
    if(id!==speakId){btn.textContent='🔊 Suno';return}
    if(k>=parts.length){speaking=null;btn.textContent='🔊 Suno';return}
    const u=new SpeechSynthesisUtterance(parts[k++]);u.lang='hi-IN';if(v)u.voice=v;u.onend=next;u.onerror=next;ss.speak(u);
  };
  next();
}

/* charts (sirf numbers se SVG/HTML banta hai) */
const C=['#0F9D6E','#e5a13a','#4a8fe0'];
const F=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const S=n=>n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(2)+' L':F(n);
function pie(d){const t=d.reduce((s,x)=>s+x[1],0)||1,r=40,c=2*Math.PI*r;let o=0;
  const a=d.map((x,i)=>{const l=Math.max(0,x[1])/t*c,s='<circle r="'+r+'" cx="60" cy="60" fill="none" stroke="'+C[i]+'" stroke-width="22" stroke-dasharray="'+l+' '+(c-l)+'" stroke-dashoffset="'+(-o)+'" transform="rotate(-90 60 60)"/>';o+=l;return s}).join('');
  return '<div class="pie"><svg viewBox="0 0 120 120">'+a+'</svg><div class="lg">'+d.map((x,i)=>'<div><i style="background:'+C[i]+'"></i>'+x[0]+' · '+Math.round(Math.max(0,x[1])/t*100)+'% ('+S(x[1])+')</div>').join('')+'</div></div>'}
function bars(d){const m=Math.max(...d.map(x=>Math.abs(x[1])),1);
  return '<div class="bars">'+d.map((x,i)=>'<div class="b"><b>'+S(x[1])+'</b><span style="height:'+Math.max(2,Math.abs(x[1])/m*70)+'%;background:'+C[i%3]+'"></span><small>'+x[0]+'</small></div>').join('')+'</div>'}
function line(a,b){const m=Math.max(...a,...b,1),p=s=>s.map((v,i)=>(i/((s.length-1)||1)*200).toFixed(1)+','+(78-v/m*74).toFixed(1)).join(' ');
  return '<svg class="ln" viewBox="0 0 200 80" preserveAspectRatio="none"><polyline points="'+p(a)+'" fill="none" stroke="'+C[1]+'" stroke-width="2" vector-effect="non-scaling-stroke"/><polyline points="'+p(b)+'" fill="none" stroke="'+C[0]+'" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg><div class="lgd"><span style="color:'+C[1]+'">━</span> Lagaya hua paisa &nbsp; <span style="color:'+C[0]+'">━</span> Kul value</div>'}
const emi=(a,r,y)=>{const i=r/1200,n=Math.max(1,Math.round(y*12)),p=Math.pow(1+i,n);return {e:i?a*i*p/(p-1):a/n,n}};

function botMsg(bot,text,animate,extra){
  bot.classList.remove('thinking','err');bot.innerHTML='';
  const span=document.createElement('span');bot.appendChild(span);
  const tools=document.createElement('div');tools.className='tools';
  const finish=()=>{
    if(!bot.isConnected)return;
    renderRich(span,text);
    mk(tools,'Copy',b=>copyText(text,b));
    mk(tools,'🔊 Suno',b=>speak(text,b));
    if(bot===lastBot)mk(tools,'🔄 Dobara',()=>regen(bot));
    if(span.querySelector('table')){
      mk(tools,'Excel',()=>dl('rupeyantra.xls','application/vnd.ms-excel',wrap(sheet(span))));
      mk(tools,'CSV',()=>dl('rupeyantra.csv','text/csv;charset=utf-8',csvOf(span.querySelector('table'))));
    }
    if(text.length>300){
      mk(tools,'Word',()=>dl('rupeyantra.doc','application/msword',wrap(span.innerHTML)));
      mk(tools,'TXT',()=>dl('rupeyantra.txt','text/plain;charset=utf-8',text));
    }
    mk(tools,'PDF',()=>printEl(bot));
    if(navigator.share)mk(tools,'Share',()=>navigator.share({text:text+'\n\n- Rupeyantra AI'}).catch(()=>{}));
    const up=mk(tools,'👍',()=>{up.classList.toggle('on');dn.classList.remove('on')});
    const dn=mk(tools,'👎',()=>{dn.classList.toggle('on');up.classList.remove('on')});
    if(extra&&extra.verified){const v=document.createElement('div');v.className='vf';v.textContent='✓ Calculator se verified';bot.appendChild(v)}
    bot.appendChild(tools);
    if(extra&&Array.isArray(extra.options)&&extra.options.length){
      const o=document.createElement('div');o.className='opts';
      extra.options.slice(0,6).forEach(t=>{
        if(typeof t!=='string'||!t)return;
        const b=document.createElement('button');b.type='button';b.textContent=t;
        b.onclick=()=>{if(busy)return;o.remove();inp.value=t;grow();form.requestSubmit()};
        o.appendChild(b);
      });
      if(o.children.length)bot.appendChild(o);
    }
    down();
  };
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!animate||reduce||text.length<40){finish();return}
  const my=gen;let i=0;const step=Math.max(3,Math.ceil(text.length/90));
  const timer=setInterval(()=>{
    if(my!==gen||!bot.isConnected){clearInterval(timer);finish();return}
    i+=step;
    if(i>=text.length){clearInterval(timer);finish();return}
    span.textContent=text.slice(0,i);down();
  },18);
}
function regen(bot){
  if(busy||bot!==lastBot||!convo.length||convo[convo.length-1].role!=='assistant')return;
  convo.pop();if(log.length&&log[log.length-1].role==='bot')log.pop();
  bot.remove();lastBot=null;save();send();
}

/* rich jawab: table, code box, bold, rupaye */
function numify(p,s){s.split(/(₹\s?[\d,]+(?:\.\d+)?(?:\s?(?:lakh|crore|Lakh|Crore|L|Cr)\b)?)/).forEach((t,i)=>{if(!t)return;if(i%2){const n=document.createElement('span');n.className='num';n.textContent=t;p.appendChild(n)}else p.appendChild(document.createTextNode(t))})}
function inl(p,s){s.split(/(\*\*[^*\n]+\*\*)/).forEach(part=>{if(/^\*\*[^*]+\*\*$/.test(part)){const b=document.createElement('strong');numify(b,part.slice(2,-2));p.appendChild(b)}else numify(p,part)})}
const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
const EXT={html:'html',js:'js',javascript:'js',python:'py',py:'py',css:'css',json:'json',csv:'csv',sql:'sql'};
function codeCard(lang,code){
  const d=document.createElement('div');d.className='code';
  const h=document.createElement('div');h.className='h';
  const nm=document.createElement('span');nm.textContent='💻 '+(lang||'code');h.appendChild(nm);
  mk(h,'Copy',b=>copyText(code,b));
  const ext=EXT[(lang||'').toLowerCase()]||'txt';
  mk(h,'⬇ .'+ext,()=>dl('rupeyantra-code.'+ext,'text/plain;charset=utf-8',code));
  const pre=document.createElement('pre'),cd=document.createElement('code');cd.textContent=code;pre.appendChild(cd);
  let fr=null;
  if(ext==='html')mk(h,'👁 Preview',()=>{
    if(fr){fr.remove();fr=null;return}
    fr=document.createElement('iframe');fr.setAttribute('sandbox','allow-scripts');fr.title='Preview';fr.srcdoc=code;d.appendChild(fr);
  });
  d.appendChild(h);d.appendChild(pre);return d;
}
function renderRich(el,text){
  el.textContent='';const L=text.split('\n');let buf=[];
  const flush=()=>{if(buf.length){const d=document.createElement('div');inl(d,buf.join('\n'));el.appendChild(d);buf=[]}};
  for(let i=0;i<L.length;i++){
    const fence=/^\s*```\s*([\w+-]*)\s*$/.exec(L[i]);
    if(fence){
      flush();const c=[];i++;
      while(i<L.length&&!/^\s*```\s*$/.test(L[i])){c.push(L[i]);i++}
      el.appendChild(codeCard(fence[1],c.join('\n')));continue;
    }
    if(isRow(L[i])&&i+1<L.length&&isSep(L[i+1])){
      flush();
      const t=document.createElement('table'),th=document.createElement('thead'),tb=document.createElement('tbody'),hr=document.createElement('tr');
      cells(L[i]).forEach(c=>{const x=document.createElement('th');inl(x,c);hr.appendChild(x)});th.appendChild(hr);
      i+=2;
      while(i<L.length&&isRow(L[i])){const r=document.createElement('tr');cells(L[i]).forEach(c=>{const x=document.createElement('td');inl(x,c);r.appendChild(x)});tb.appendChild(r);i++}
      i--;t.appendChild(th);t.appendChild(tb);
      const w=document.createElement('div');w.className='tw';w.appendChild(t);el.appendChild(w);
    }else buf.push(L[i]);
  }
  flush();
}

/* attachments */
function readDataURL(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('File padh nahi payi'));r.readAsDataURL(f)})}
function readText(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('File padh nahi payi'));r.readAsText(f)})}
function loadImage(url){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error('Is photo ka format support nahi hai'));im.src=url})}
function drawScaled(im,max,q){
  const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  return c.toDataURL('image/jpeg',q);
}
const b64Of=u=>u.split(',')[1]||'';
const pendingB64=()=>pending.reduce((n,p)=>n+(p.data?p.data.length:0),0);
async function prepareImage(f){
  const url=await readDataURL(f),im=await loadImage(url);
  const room=Math.min(MAX_B64,MAX_TOTAL_B64-pendingB64());
  for(const [max,q] of [[1600,.82],[1280,.78],[1024,.72],[800,.65]]){
    const data=b64Of(drawScaled(im,max,q));
    if(data.length&&data.length<=room)return {kind:'image',name:f.name||'photo.jpg',mime:'image/jpeg',data,thumb:drawScaled(im,120,.7)};
  }
  throw new Error('Photo bahut badi hai; chhoti photo bhejo');
}
async function preparePdf(f){
  if(f.size>MAX_PDF)throw new Error('PDF 2 MB se chhoti honi chahiye');
  const data=b64Of(await readDataURL(f));
  if(!data||data.length>MAX_TOTAL_B64-pendingB64())throw new Error('Files ka total size bahut zyada hai');
  return {kind:'pdf',name:f.name||'file.pdf',mime:'application/pdf',data,thumb:null};
}
async function prepareText(f){
  if(f.size>MAX_TEXT_FILE)throw new Error('Text file bahut badi hai');
  const text=(await readText(f)).replace(/\u0000/g,'').trim();
  if(!text)throw new Error('File khali hai');
  return {kind:'text',name:f.name||'file.txt',text:text.slice(0,TEXT_PER_FILE),thumb:null};
}
async function addFiles(files){
  for(const f of files){
    if(pending.length>=MAX_FILES){warn('Ek baar mein sirf '+MAX_FILES+' files jod sakte hain.');break}
    try{
      let item;
      if(f.type.startsWith('image/'))item=await prepareImage(f);
      else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))item=await preparePdf(f);
      else if(f.type.startsWith('text/')||f.type==='application/json'||TEXT_EXT.test(f.name))item=await prepareText(f);
      else throw new Error('Ye file type support nahi hai (photo, PDF ya text/CSV file bhejo)');
      pending.push(item);
    }catch(e){warn((f.name?f.name+': ':'')+(e.message||'File jod nahi payi'))}
  }
  renderChips();
}
function renderChips(){
  chips.innerHTML='';
  pending.forEach((p,idx)=>{
    const c=document.createElement('div');c.className='chip';
    if(p.thumb){const im=document.createElement('img');im.src=p.thumb;im.alt='';c.appendChild(im)}
    else{const ic=document.createElement('span');ic.className='ic';ic.textContent='📄';c.appendChild(ic)}
    const nm=document.createElement('span');nm.className='nm';nm.textContent=p.name;c.appendChild(nm);
    const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label',p.name+' hatao');
    x.onclick=()=>{pending.splice(idx,1);renderChips()};
    c.appendChild(x);chips.appendChild(c);
  });
  refresh();
}
function buildContent(text){
  const blocks=pending.filter(p=>p.kind==='text').map(p=>'[FILE: '+p.name.replace(/[\]\n\r]/g,' ').slice(0,100)+']\n'+p.text+'\n[FILE END]');
  if(!blocks.length)return text;
  const head=text||'Is file ko dekho aur batao isme kya hai.';
  return (head+'\n\n'+blocks.join('\n\n')).slice(0,MAX_CONTENT);
}

/* send */
async function send(){
  const my=++gen;
  stopped=false;
  controller=new AbortController();
  const bot=thinkingBot();activeBot=bot;setBusy(true);
  let timedOut=false,serverData={};
  const timer=setTimeout(()=>{timedOut=true;controller.abort()},REQUEST_TIMEOUT);
  try{
    const last=convo.length-1;
    const payload=convo.map((m,i)=>{const o={role:m.role,content:m.content};if(i===last&&m.attachments)o.attachments=m.attachments;return o});
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:payload}),signal:controller.signal});
    try{serverData=await r.json()}catch(_){}
    if(my!==gen)return;
    const reply=serverData&&typeof serverData.reply==='string'?serverData.reply.trim():'';
    if(!r.ok||!reply){
      const e=new Error((serverData&&serverData.message)||'Abhi jawab nahi mil paya. Dobara try karein.');
      e.fromServer=true;throw e;
    }
    setBusy(false);
    const asked=lastDraft;
    lastUserEl=null;
    convo.push({role:'assistant',content:reply});
    log.push({role:'bot',text:reply});
    save();
    lastBot=bot;
    botMsg(bot,reply,true,{verified:serverData.verified===true,options:serverData.options});
    // sawal ke hisaab se calculator card apne aap khul jaye
    const hit=INTENT.find(x=>x[0].test(asked));
    if(hit)toolCard(hit[1]);
  }catch(e){
    if(stopped||my!==gen)return;
    let msg=e&&e.fromServer?e.message:timedOut?'Jawab dene mein der lag gayi. Dobara try karein.':'Internet check karke dobara try karein.';
    if(DEBUG){msg+='\n['+(e&&e.message||'')+']'+(serverData&&serverData.debug?'\n'+JSON.stringify(serverData.debug):'')}
    setBusy(false);
    showError(bot,msg,()=>{if(busy)return;bot.remove();send()});
  }finally{
    clearTimeout(timer);
    if(my===gen&&busy)setBusy(false);
  }
}

form.addEventListener('submit',e=>{
  e.preventDefault();
  if(busy)return;
  const text=inp.value.trim();
  if(!text&&!pending.length)return;
  const content=buildContent(text);
  const atts=pending.filter(p=>p.kind!=='text');
  const msg={role:'user',content};
  if(atts.length)msg.attachments=atts.map(a=>({mime:a.mime,data:a.data}));
  convo.push(msg);
  const shown=pending.map(p=>({name:p.name,thumb:p.thumb||null}));
  log.push({role:'user',text,atts:shown});
  app.classList.add('chatting');
  lastUserEl=addUser(text,shown);lastDraft=text;
  pending=[];renderChips();
  inp.value='';grow();
  if(rec){try{rec.stop()}catch(_){}}
  save();
  send();
});

stopBtn.onclick=()=>{
  if(!busy)return;
  stopped=true;gen++;
  if(controller)controller.abort();
  if(activeBot&&activeBot.isConnected)activeBot.remove();
  const lastMsg=convo[convo.length-1];
  if(lastMsg&&lastMsg.role==='user'){
    convo.pop();
    if(log.length&&log[log.length-1].role==='user')log.pop();
    if(lastUserEl&&lastUserEl.isConnected)lastUserEl.remove();
    lastUserEl=null;
    if(!inp.value.trim())inp.value=lastDraft||'';
    grow();save();
    if(!convo.length&&!log.length&&!msgs.children.length)app.classList.remove('chatting');
  }
  setBusy(false);
};

/* naya chat */
$('newChat').onclick=async()=>{
  stopped=true;gen++;
  if(controller)controller.abort();
  if(rec){try{rec.stop()}catch(_){}}
  if(window.speechSynthesis){speakId++;speechSynthesis.cancel()}
  convo=[];log=[];pending=[];activeBot=null;lastUserEl=null;lastBot=null;
  msgs.innerHTML='';
  app.classList.remove('chatting');
  setBusy(false);renderChips();inp.value='';grow();
  await wipe();
  inp.focus();
};

/* bolkar poochho */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){mic.onclick=()=>warn('Is browser mein mic support nahi hai. Chrome use karein.')}
else{
  mic.onclick=()=>{
    if(rec){try{rec.stop()}catch(_){}return}
    const r=new SR();
    r.lang='hi-IN';r.interimResults=false;r.continuous=false;
    r.onresult=ev=>{
      const t=Array.from(ev.results).map(x=>x[0].transcript).join(' ').trim();
      if(t){inp.value=(inp.value?inp.value+' ':'')+t;grow()}
    };
    r.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')warn('Mic use karne ki permission do.');else if(ev.error!=='no-speech'&&ev.error!=='aborted')warn('Awaaz samajh nahi aayi, dobara try karein.')};
    r.onend=()=>{rec=null;mic.classList.remove('on')};
    rec=r;mic.classList.add('on');
    try{r.start()}catch(_){rec=null;mic.classList.remove('on')}
  };
}

/* pichhla chat wapas laao */
async function restore(){
  let snap=null;
  try{snap=await dbGet()}catch(_){}
  if(!snap){try{snap=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}}
  if(!snap||!Array.isArray(snap.log)||!snap.log.length)return;
  log=snap.log.filter(l=>l&&(l.role==='user'||l.role==='bot')&&typeof l.text==='string');
  convo=Array.isArray(snap.history)?snap.history.filter(m=>m&&(m.role==='user'||m.role==='assistant')&&typeof m.content==='string'):[];
  if(!log.length)return;
  app.classList.add('chatting');
  log.forEach(l=>{if(l.role==='user')addUser(l.text,Array.isArray(l.atts)?l.atts:[]);else botMsg(add('bot',''),l.text,false)});
}
restore().catch(()=>{});
