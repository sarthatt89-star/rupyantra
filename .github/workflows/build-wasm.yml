name: build-wasm

on:
  push:
    paths:
      - 'cpp-engine/**'
      - 'lib/cpp-*.js'
      - 'tests/cpp-*.test.js'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Native C++ tests
        run: |
          for t in test_core test_simulations; do
            g++ -std=c++17 -O2 -Wall -Wextra -Icpp-engine/include -Icpp-engine/src \
              cpp-engine/src/*.cpp cpp-engine/tests/$t.cpp -o /tmp/ry_$t
            /tmp/ry_$t
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: C++ vs JavaScript calculators (native build, 1,800+ random cases)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Icpp-engine/include -Icpp-engine/src \
            cpp-engine/src/*.cpp cpp-engine/tests/cli.cpp -o /tmp/ry_cli
          RY_CLI=/tmp/ry_cli node --test tests/cpp-vs-js.test.js

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build WASM
        run: |
          mkdir -p lib/wasm
          EXPORTS=$(grep -ho 'rupeyantra_[a-z0-9_]*' cpp-engine/include/finance.h | sort -u | sed 's/^/_/' | paste -sd, -)
          echo "exports: $EXPORTS"
          emcc cpp-engine/src/*.cpp -O3 -std=c++17 -Icpp-engine/include -Icpp-engine/src \
            --no-entry -s STANDALONE_WASM=1 -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_FUNCTIONS="$EXPORTS" \
            -o lib/wasm/finance.wasm
          ls -l lib/wasm

      - name: Smoke test WASM in Node
        run: node cpp-engine/tests/wasm-smoke.js lib/wasm/finance.wasm

      - name: WASM vs JavaScript calculators and bridge tests
        run: node --test tests/cpp-vs-js.test.js tests/cpp-bridge.test.js tests/cpp-tools.test.js

      - name: Speed (JS vs WASM, for the record)
        run: node cpp-engine/tests/bench.js

      - name: Commit WASM to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/wasm/finance.wasm
          if git diff --cached --quiet; then
            echo "finance.wasm unchanged"
          else
            git commit -m "build: update finance.wasm"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
