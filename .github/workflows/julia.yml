name: julia-engine

on:
  push:
    paths:
      - 'julia-engine/**'
      - 'lib/julia-bridge.js'
      - 'tests/julia-vs-cpp.test.js'
      - 'tests/julia-bridge.test.js'
      - '.github/workflows/julia.yml'
  workflow_dispatch:

jobs:
  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Julia runtime and dependencies
        run: |
          julia --version
          julia --project=julia-engine -e 'using Pkg; Pkg.instantiate(); Pkg.status()'

      - name: Julia unit tests (4 threads)
        shell: bash
        run: |
          set +e
          julia --project=julia-engine -t 4 -e 'using Pkg; Pkg.test()' 2>&1 | tee julia-test.log
          code=${PIPESTATUS[0]}
          echo ""
          echo "================ FAILURE SUMMARY (short) ================"
          grep -nE "Test Failed|Error During Test|Expression:|Evaluated:|ERROR:|MethodError|UndefVarError|BoundsError|ArgumentError|DomainError|TypeError" julia-test.log | head -60
          echo "---------------- Test Summary table ----------------"
          grep -A 30 "Test Summary:" julia-test.log | head -60
          grep -E "Test Failed|Error During Test" julia-test.log | head -5 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $code

      - name: Results do not depend on thread count
        run: |
          REQ='{"fn":"sip_monte_carlo","args":{"monthly_amount":10000,"annual_return":12,"annual_volatility":15,"months":120,"simulations":20000,"seed":7}}'
          A=$(echo "$REQ" | julia --project=julia-engine -t 1 julia-engine/bin/run.jl | python3 -c "import sys,json;print(json.dumps(json.load(sys.stdin)['result'],sort_keys=True))")
          B=$(echo "$REQ" | julia --project=julia-engine -t 4 julia-engine/bin/run.jl | python3 -c "import sys,json;print(json.dumps(json.load(sys.stdin)['result'],sort_keys=True))")
          echo "1 thread : $A" | cut -c1-200
          echo "4 threads: $B" | cut -c1-200
          test "$A" = "$B"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS bridge tests (offline fake service + real Julia)
        run: RY_JULIA=julia node --test tests/julia-bridge.test.js

      - name: Julia vs C++ (WASM) parity
        run: |
          test -f lib/wasm/finance.wasm || { echo "finance.wasm missing (build-wasm must run first)"; exit 1; }
          RY_JULIA=julia node --test tests/julia-vs-cpp.test.js
