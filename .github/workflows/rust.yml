name: rust-engine

on:
  push:
    paths:
      - 'rust-engine/**'
      - 'python-engine/**'
      - 'lib/rust-bridge.js'
      - 'tests/rust-bridge.test.js'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust version
        run: cargo --version && rustc --version

      - name: Build (release)
        working-directory: rust-engine
        run: cargo build --release --locked

      - name: Clippy (warnings are errors)
        working-directory: rust-engine
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests (unit + binary + real Python service)
        shell: bash
        working-directory: rust-engine
        env:
          RY_PYTHON: python
        run: |
          set +e
          cargo test --locked 2>&1 | tee ../rust-test.log
          code=${PIPESTATUS[0]}
          echo "================ FAILURE SUMMARY (short) ================"
          grep -nE "^test .* FAILED|panicked at|^error" ../rust-test.log | head -40
          grep -E "^test .* FAILED|^error" ../rust-test.log | head -5 | while IFS= read -r line; do echo "::error::${line}"; done
          grep -E "^test result" ../rust-test.log
          exit $code

      - name: JS bridge tests (offline fake service + real Rust binary + real service)
        run: RY_RUST="$PWD/rust-engine/target/release/rupeyantra-rust" node --test tests/rust-bridge.test.js

      - name: Benchmark (printed for the record, not a pass/fail check)
        working-directory: rust-engine
        run: cargo bench --locked
