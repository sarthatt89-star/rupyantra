[package]
name = "rupeyantra-rust-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Rupeyantra Rust engine: secured service, parallel data processing and reliability for the other engines."

[lib]
name = "rust_engine"
path = "src/lib.rs"

[[bin]]
name = "rupeyantra-rust"
path = "src/main.rs"

[[bench]]
name = "parallel_bench"
harness = false

# No third-party dependencies: the engine uses only the Rust standard library.
[dependencies]

[profile.release]
opt-level = 3
# panic stays "unwind": the engine catches a panic inside one calculation and reports INTERNAL_ERROR.
