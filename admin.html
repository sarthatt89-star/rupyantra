<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:420px;margin:32px auto;padding:0 16px;color:#1b1b2f}
h1{font-size:20px;margin:0 0 16px}
h2{font-size:16px;margin:20px 0 8px}
button{font:inherit;padding:10px 14px;border:0;border-radius:8px;background:#3b5bdb;color:#fff;cursor:pointer;width:100%}
button:disabled{opacity:.5}
input{font:inherit;font-size:18px;letter-spacing:6px;text-align:center;width:100%;padding:10px;margin:8px 0;box-sizing:border-box;border:1px solid #bbb;border-radius:8px}
.msg{margin:10px 0;font-size:14px;min-height:20px}
.err{color:#c92a2a}.ok{color:#2b8a3e}
.box{margin-top:12px}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}
.row span:last-child{text-align:right;color:#555}
.tick{font-weight:700}
.tick.ok{color:#2b8a3e}.tick.bad{color:#c92a2a}
.small{font-size:12px;color:#777}
</style>
</head>
<body>
<h1>Admin</h1>

<div id="login">
  <div class="box">
    <button id="reqBtn" type="button">OTP bhejo</button>
  </div>
  <div class="box" id="verifyBox" hidden>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    <button id="verifyBtn" type="button">Login</button>
  </div>
  <div id="msg" class="msg" role="status"></div>
</div>

<div id="loggedIn" hidden>
  <p class="msg ok" id="who"></p>
  <button id="refreshBtn" type="button">Status refresh karo</button>
  <div id="statusMsg" class="msg" role="status"></div>
  <div id="report"></div>
  <h2>AI se baat</h2>
  <textarea id="chatIn" rows="3" maxlength="1000" placeholder="Jaise: aaj kya error aayi?" style="width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid #bbb;border-radius:8px"></textarea>
  <div class="box"><button id="chatBtn" type="button">Poochho</button></div>
  <div id="chatOut" class="msg" style="white-space:pre-wrap"></div>
  <div class="box"><button id="logoutBtn" type="button">Logout</button></div>
</div>

<script>
(function () {
  var AUTH = '/api/admin/auth?action=';
  var $ = function (id) { return document.getElementById(id); };

  function setMsg(id, text, cls) {
    var el = $(id);
    el.textContent = text || '';
    el.className = 'msg ' + (cls || '');
  }

  function getJson(url) {
    return fetch(url, { credentials: 'same-origin' }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { j.status = r.status; return j; });
    });
  }

  function post(action, body) {
    return fetch(AUTH + action, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { j.status = r.status; return j; });
    });
  }

  function row(label, ok, detail) {
    var wrap = document.createElement('div');
    wrap.className = 'row';
    var a = document.createElement('span');
    var mark = document.createElement('span');
    mark.className = 'tick ' + (ok ? 'ok' : 'bad');
    mark.textContent = ok ? '✓ ' : '✗ ';
    a.textContent = mark.textContent + label;
    var b = document.createElement('span');
    b.textContent = detail || '';
    wrap.appendChild(a);
    wrap.appendChild(b);
    return wrap;
  }

  function probeText(p) {
    if (!p) return '';
    if (p.error) return p.error;
    return (p.status || '-') + ' · ' + (p.ms || 0) + ' ms';
  }

  function render(r) {
    var box = $('report');
    box.textContent = '';
    var site = r.site || {};
    box.appendChild(row('Overall', r.ok, r.ok ? 'sab theek' : 'kuch check karna hai'));
    box.appendChild(document.createElement('h2')).textContent = 'Site';
    if (site.config) {
      box.appendChild(row('SITE_URL', false, site.config.note));
    } else {
      box.appendChild(row('Home /', site.home && site.home.ok, probeText(site.home)));
      box.appendChild(row('/ai', site.ai && site.ai.ok, probeText(site.ai)));
      box.appendChild(row('/api/chat', site.chatApi && site.chatApi.ok, probeText(site.chatApi)));
    }
    var calc = r.calculator || {};
    box.appendChild(document.createElement('h2')).textContent = 'Calculator';
    box.appendChild(row('EMI (50 lakh, 8.5%, 20 saal)', calc.emi && calc.emi.ok, calc.emi ? calc.emi.note : ''));
    box.appendChild(row('SIP (5000, 12%, 10 saal)', calc.sip && calc.sip.ok, calc.sip ? calc.sip.note : ''));
    box.appendChild(document.createElement('h2')).textContent = 'Services';
    box.appendChild(row('Gmail alert', r.alerts && r.alerts.configured, ''));
    box.appendChild(row('Upstash ginti', r.store && r.store.configured, ''));
    box.appendChild(document.createElement('h2')).textContent = 'AI keys';
    var keys = r.keys || {};
    Object.keys(keys).forEach(function (p) {
      var k = keys[p] || {};
      var note = k.total + ' key, ' + k.available + ' chalu' + (k.cooling ? ', ' + k.cooling + ' limit par' : '');
      box.appendChild(row(p, k.total > 0 && k.available > 0, note));
    });
    var t = r.today || {};
    box.appendChild(document.createElement('h2')).textContent = 'Aaj';
    box.appendChild(row('Sawal', true, 'kul ' + t.requests + ' · jawab ' + t.ok + ' · fail ' + t.fail + (t.available ? '' : ' (ginti band)')));
    box.appendChild(document.createElement('h2')).textContent = 'Haal ki errors';
    var errs = r.recentErrors || [];
    if (!errs.length) {
      var none = document.createElement('p');
      none.className = 'small';
      none.textContent = 'Koi error record nahi hai.';
      box.appendChild(none);
    }
    errs.forEach(function (e) {
      box.appendChild(row(e.type || '?', false, [e.t, e.code, e.provider].filter(Boolean).join(' · ')));
    });
    var ts = document.createElement('p');
    ts.className = 'small';
    ts.textContent = 'Check ka time: ' + (r.checkedAt || '');
    box.appendChild(ts);
  }

  function loadStatus() {
    setMsg('statusMsg', 'Status check ho raha hai...');
    return getJson('/api/admin/status').then(function (j) {
      if (j.status === 401) { showLogin(); return; }
      if (j.status !== 200) { setMsg('statusMsg', 'Status nahi mila. Dobara try karein.', 'err'); return; }
      setMsg('statusMsg', '');
      render(j);
    }).catch(function () { setMsg('statusMsg', 'Network ki dikkat.', 'err'); });
  }

  function showLogin() {
    $('loggedIn').hidden = true;
    $('login').hidden = false;
  }

  function showLoggedIn(email) {
    $('login').hidden = true;
    $('loggedIn').hidden = false;
    $('who').textContent = 'Login hai: ' + email;
    loadStatus();
  }

  getJson(AUTH + 'session').then(function (j) {
    if (j.ok) showLoggedIn(j.email);
  }).catch(function () {});

  $('reqBtn').addEventListener('click', function () {
    $('reqBtn').disabled = true;
    setMsg('msg', 'OTP bheja ja raha hai...');
    post('request').then(function (j) {
      if (j.ok) {
        $('verifyBox').hidden = false;
        $('code').focus();
        setMsg('msg', j.message, 'ok');
      } else {
        setMsg('msg', j.message || 'OTP nahi bheja ja saka.', 'err');
      }
    }).catch(function () {
      setMsg('msg', 'Network ki dikkat. Dobara try karein.', 'err');
    }).then(function () {
      setTimeout(function () { $('reqBtn').disabled = false; }, 60000);
    });
  });

  $('verifyBtn').addEventListener('click', function () {
    var code = $('code').value.trim();
    if (!/^\d{6}$/.test(code)) { setMsg('msg', '6 digit ka OTP daalein.', 'err'); return; }
    $('verifyBtn').disabled = true;
    post('verify', { code: code }).then(function (j) {
      if (j.ok) {
        getJson(AUTH + 'session').then(function (s) { showLoggedIn(s.email || 'admin'); });
      } else {
        var extra = (j.left !== undefined) ? ' (baaki koshish: ' + j.left + ')' : '';
        setMsg('msg', (j.message || 'Login nahi hua.') + extra, 'err');
        $('verifyBtn').disabled = false;
      }
    }).catch(function () {
      setMsg('msg', 'Network ki dikkat. Dobara try karein.', 'err');
      $('verifyBtn').disabled = false;
    });
  });

  $('refreshBtn').addEventListener('click', loadStatus);

  $('chatBtn').addEventListener('click', function () {
    var q = $('chatIn').value.trim();
    if (!q) { setMsg('chatOut', 'Sawal likhein.', 'err'); return; }
    $('chatBtn').disabled = true;
    setMsg('chatOut', 'Jawab soch raha hoon...');
    fetch('/api/admin/chat', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: q })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { j.status = r.status; return j; });
    }).then(function (j) {
      if (j.ok) { setMsg('chatOut', j.answer, 'ok'); }
      else if (j.status === 401) { showLogin(); }
      else { setMsg('chatOut', j.message || 'Jawab nahi mila.', 'err'); }
    }).catch(function () {
      setMsg('chatOut', 'Network ki dikkat.', 'err');
    }).then(function () {
      $('chatBtn').disabled = false;
    });
  });

  $('logoutBtn').addEventListener('click', function () {
    post('logout').then(function () { location.reload(); });
  });
})();
</script>
</body>
</html>
