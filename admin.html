<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#020605">
<title>rupeyantra// root</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020605;--panel:#07120d;--line:#12382a;--g:#39ff88;--gd:#1f9e57;--dim:#5c8f78;--amber:#ffb454;--red:#ff4d5e;--cy:#4de1ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--g);font:14px/1.55 "Fira Code",ui-monospace,Menlo,Consolas,monospace;
 background-image:repeating-linear-gradient(0deg,rgba(57,255,136,.035) 0 1px,transparent 1px 3px)}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.bar b{color:var(--g);font-weight:700}
.bar .host{color:var(--dim);font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.tabs button,.btn{font:inherit;background:transparent;color:var(--g);border:1px solid var(--line);padding:7px 12px;border-radius:2px;cursor:pointer;white-space:nowrap}
.tabs button.on,.btn:hover,.tabs button:hover{background:var(--g);color:#001a0c;border-color:var(--g)}
.btn.warn{color:var(--red);border-color:#4a1a22}.btn.warn:hover{background:var(--red);color:#1a0004;border-color:var(--red)}
.btn:disabled{opacity:.4;pointer-events:none}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.pane{display:none;flex:1;min-height:0;overflow:auto;padding:6px 2px 12px}
.pane.on{display:flex;flex-direction:column}
#term{flex:1;min-height:0;overflow:auto;padding:8px 2px;overscroll-behavior:contain}
.ln{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 8px}
.ln.you{color:var(--cy)}.ln.sys{color:var(--dim)}.ln.err{color:var(--red)}.ln.ai{color:var(--g)}
.ln .p{color:var(--dim)}
.quick{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.quick button{font:12px "Fira Code",monospace;background:var(--panel);color:var(--gd);border:1px solid var(--line);padding:5px 10px;border-radius:2px;cursor:pointer;white-space:nowrap}
.quick button:hover{color:var(--g);border-color:var(--gd)}
.prompt{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding:8px 0}
.prompt span{color:var(--g);padding-bottom:7px}
textarea,input{font:inherit;background:transparent;color:var(--g);border:0;border-bottom:1px solid var(--line);width:100%;padding:6px 2px;caret-color:var(--g);resize:none;border-radius:0}
textarea::placeholder,input::placeholder{color:#2f5a47}
textarea:focus,input:focus{outline:none;border-bottom-color:var(--g)}
.box{border:1px solid var(--line);background:var(--panel);padding:10px;margin:0 0 12px}
h2{font-size:13px;color:var(--amber);margin:14px 0 6px;font-weight:500}
h2::before{content:"## ";color:var(--dim)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line)}
.row .r{color:var(--dim);text-align:right;overflow-wrap:anywhere}
.ok{color:var(--g)}.bad{color:var(--red)}.mid{color:var(--amber)}
.small{font-size:12px;color:var(--dim)}
#login{margin:auto;width:100%;max-width:420px}
#login input{font-size:22px;letter-spacing:8px;text-align:center}
.msg{min-height:22px;margin:10px 0;font-size:13px}
.cur{display:inline-block;width:8px;height:15px;background:var(--g);vertical-align:-2px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><b>root@rupeyantra</b><span class="host">:~# admin --secure</span><span id="who" class="host" style="margin-left:auto"></span></div>

  <section id="login" hidden>
    <p class="ln sys">$ authenticate --otp<br>Admin email par 6 digit code jayega.</p>
    <button class="btn" id="reqBtn" type="button" style="width:100%">&gt; otp bhejo</button>
    <div id="verifyBox" hidden style="margin-top:14px">
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="OTP">
      <button class="btn" id="verifyBtn" type="button" style="width:100%;margin-top:10px">&gt; login</button>
    </div>
    <div id="msg" class="msg" role="status"></div>
  </section>

  <div id="dash" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
    <nav class="tabs" role="tablist">
      <button class="on" data-t="chat" role="tab">chat</button>
      <button data-t="status" role="tab">status</button>
      <button data-t="route" role="tab">ai-routing</button>
      <button data-t="gloss" role="tab">glossary</button>
      <button data-t="rep" role="tab">sawal-report</button>
      <button class="warn btn" id="logoutBtn" type="button" style="margin-left:auto">logout</button>
    </nav>
    <main>
      <div class="pane on" id="p-chat">
        <div id="term" aria-live="polite"></div>
        <div class="quick" id="quick"></div>
        <form class="prompt" id="chatForm">
          <span>&gt;</span>
          <textarea id="chatIn" rows="1" maxlength="1000" placeholder="poochho: kya kharab hai? keys kaisi hain?" aria-label="Sawal"></textarea>
          <button class="btn" id="chatBtn" type="submit">run</button>
        </form>
      </div>
      <div class="pane" id="p-status">
        <div><button class="btn" id="refreshBtn" type="button">&gt; refresh</button></div>
        <div id="statusMsg" class="msg" role="status"></div>
        <div id="report"></div>
      </div>
      <div class="pane" id="p-route"><p class="small">Sawal ke type ke hisaab se AI ka order. Badalne ke liye Vercel env <b>AI_ROUTING</b> (jaise <b>calc=groq,gemini; chat=cerebras</b>).</p><div id="routeBox"></div></div>
      <div class="pane" id="p-gloss">
        <p class="small">Yahan jo daalenge wo public chat mein us term ke poochhne par jawab banega.</p>
        <input id="gTerm" maxlength="60" placeholder="term (jaise SIP)" style="font-size:14px">
        <textarea id="gText" rows="4" maxlength="1500" placeholder="matlab (10-1500 akshar, bina &lt; &gt; ke)" style="margin-top:8px;border:1px solid var(--line);padding:8px"></textarea>
        <div style="margin-top:8px"><button class="btn" id="gSaveBtn" type="button">&gt; save</button></div>
        <div id="gMsg" class="msg" role="status"></div>
        <div id="gList"></div>
      </div>
      <div class="pane" id="p-rep"><div id="qReport"></div></div>
    </main>
  </div>
</div>

<script>
(function () {
  'use strict';
  var AUTH = '/api/admin/auth?action=';
  var $ = function (id) { return document.getElementById(id); };
  var history = [];

  function setMsg(id, text, cls) { var e = $(id); e.textContent = text || ''; e.className = 'msg ' + (cls || ''); }
  function jfetch(url, opt) {
    opt = opt || {}; opt.credentials = 'same-origin';
    return fetch(url, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { j.status = r.status; return j; });
    });
  }
  function postJson(url, body) {
    return jfetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  }
  function row(label, state, detail) {
    var w = document.createElement('div'); w.className = 'row';
    var a = document.createElement('span');
    a.className = state === true ? 'ok' : state === false ? 'bad' : 'mid';
    a.textContent = (state === true ? '[ OK ] ' : state === false ? '[FAIL] ' : '[ .. ] ') + label;
    var b = document.createElement('span'); b.className = 'r'; b.textContent = detail || '';
    w.appendChild(a); w.appendChild(b); return w;
  }
  function h2(box, t) { box.appendChild(document.createElement('h2')).textContent = t; }

  /* ---------- views ---------- */
  function showLogin() { $('dash').hidden = true; $('login').hidden = false; }
  function showDash(email) {
    $('login').hidden = true; $('dash').hidden = false;
    $('who').textContent = email;
    if (!$('term').children.length) {
      line('sys', 'rupeyantra admin shell v2. Mujhe poori website ka architecture, live status, keys aur known issues pata hain.');
      line('sys', 'Likho ya neeche ka command chuno. /clear se screen saaf.');
    }
    loadStatus(); loadGlossary(); loadReport();
  }
  document.querySelectorAll('.tabs [data-t]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs [data-t]').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.querySelectorAll('.pane').forEach(function (p) { p.classList.toggle('on', p.id === 'p-' + b.dataset.t); });
    });
  });

  /* ---------- login ---------- */
  jfetch(AUTH + 'session').then(function (j) { if (j.ok) showDash(j.email); else showLogin(); }).catch(showLogin);

  $('reqBtn').addEventListener('click', function () {
    $('reqBtn').disabled = true; setMsg('msg', 'otp bheja ja raha hai...');
    postJson(AUTH + 'request').then(function (j) {
      if (j.ok) { $('verifyBox').hidden = false; $('code').focus(); setMsg('msg', j.message, 'ok'); }
      else setMsg('msg', j.message || 'OTP nahi gaya.', 'bad');
    }).catch(function () { setMsg('msg', 'Network ki dikkat.', 'bad'); })
      .then(function () { setTimeout(function () { $('reqBtn').disabled = false; }, 60000); });
  });
  $('verifyBtn').addEventListener('click', function () {
    var code = $('code').value.trim();
    if (!/^\d{6}$/.test(code)) { setMsg('msg', '6 digit ka OTP daalein.', 'bad'); return; }
    $('verifyBtn').disabled = true;
    postJson(AUTH + 'verify', { code: code }).then(function (j) {
      if (j.ok) {
        jfetch(AUTH + 'session').then(function (s) {
          if (s.ok) { showDash(s.email); return; }
          setMsg('msg', 'Login hua par session nahi bana (cookie ya store ki dikkat). Dobara OTP mangwayein.', 'bad');
          $('verifyBtn').disabled = false;
        });
      }
      else { setMsg('msg', (j.message || 'Login nahi hua.') + (j.left !== undefined ? ' (baaki: ' + j.left + ')' : ''), 'bad'); $('verifyBtn').disabled = false; }
    }).catch(function () { setMsg('msg', 'Network ki dikkat.', 'bad'); $('verifyBtn').disabled = false; });
  });
  $('logoutBtn').addEventListener('click', function () { postJson(AUTH + 'logout').then(function () { location.reload(); }); });

  /* ---------- terminal chat ---------- */
  var QUICK = ['/status', 'routing kaisa chal raha hai?', 'kya kharab hai?', 'keys ka haal', 'aaj ki errors', 'architecture samjhao', 'kya badla/joda gaya?', 'sabse zaroori fix kya hai?'];
  QUICK.forEach(function (q) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = q;
    b.addEventListener('click', function () { runCmd(q); });
    $('quick').appendChild(b);
  });
  function line(cls, text) {
    var d = document.createElement('div'); d.className = 'ln ' + cls;
    var p = document.createElement('span'); p.className = 'p';
    p.textContent = cls === 'you' ? 'you> ' : cls === 'ai' ? 'ai> ' : cls === 'err' ? '!! ' : '# ';
    d.appendChild(p); d.appendChild(document.createTextNode(text));
    $('term').appendChild(d); $('term').scrollTop = $('term').scrollHeight; return d;
  }
  function typeOut(el, text) {
    var i = 0, step = Math.max(4, Math.ceil(text.length / 80));
    var node = document.createTextNode(''); el.appendChild(node);
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
    if (reduce) { node.data = text; return; }
    var t = setInterval(function () {
      i += step; node.data = text.slice(0, i); $('term').scrollTop = $('term').scrollHeight;
      if (i >= text.length) clearInterval(t);
    }, 16);
  }
  function runCmd(raw) {
    var q = String(raw || '').trim(); if (!q) return;
    if (q === '/clear') { $('term').textContent = ''; history = []; return; }
    if (q === '/status') { document.querySelector('[data-t=status]').click(); loadStatus(); return; }
    line('you', q);
    $('chatBtn').disabled = true;
    var wait = line('sys', 'soch raha hoon'); var cur = document.createElement('span'); cur.className = 'cur'; wait.appendChild(cur);
    postJson('/api/admin/chat', { message: q, history: history.slice(-12) }).then(function (j) {
      wait.remove();
      if (j.ok) {
        var el = line('ai', ''); typeOut(el, j.answer);
        history.push({ role: 'user', text: q }, { role: 'ai', text: j.answer });
      } else if (j.status === 401) { showLogin(); }
      else line('err', (j.message || 'Jawab nahi mila.') + ' [HTTP ' + j.status + (j.error ? ' ' + j.error : '') + ']');
    }).catch(function () { wait.remove(); line('err', 'Network ki dikkat.'); })
      .then(function () { $('chatBtn').disabled = false; $('chatIn').focus(); });
  }
  $('chatForm').addEventListener('submit', function (e) { e.preventDefault(); var v = $('chatIn').value; $('chatIn').value = ''; $('chatIn').style.height = 'auto'; runCmd(v); });
  $('chatIn').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });
  $('chatIn').addEventListener('keydown', function (e) {
    var touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !touch) { e.preventDefault(); $('chatForm').requestSubmit(); }
  });

  /* ---------- status ---------- */
  function probeText(p) { if (!p) return ''; return p.error ? p.error : (p.status || '-') + ' | ' + (p.ms || 0) + 'ms'; }
  function render(r) {
    var box = $('report'); box.textContent = '';
    var site = r.site || {};
    box.appendChild(row('OVERALL', !!r.ok, r.ok ? 'sab theek' : 'kuch check karna hai'));
    h2(box, 'site');
    if (site.config) box.appendChild(row('SITE_URL', false, site.config.note));
    else {
      box.appendChild(row('/', !!(site.home && site.home.ok), probeText(site.home)));
      box.appendChild(row('/ai', !!(site.ai && site.ai.ok), probeText(site.ai)));
      box.appendChild(row('/api/chat', !!(site.chatApi && site.chatApi.ok), probeText(site.chatApi)));
    }
    var c = r.calculator || {};
    h2(box, 'calculator');
    box.appendChild(row('emi', !!(c.emi && c.emi.ok), c.emi ? c.emi.note : ''));
    box.appendChild(row('sip', !!(c.sip && c.sip.ok), c.sip ? c.sip.note : ''));
    h2(box, 'services');
    box.appendChild(row('gmail alert', !!(r.alerts && r.alerts.configured), ''));
    box.appendChild(row('upstash store', !!(r.store && r.store.configured), ''));
    if (r.env) {
      h2(box, 'vercel env (sirf set/unset)');
      Object.keys(r.env).forEach(function (k) { box.appendChild(row(k, r.env[k] ? true : null, r.env[k] ? 'set' : 'unset')); });
    }
    h2(box, 'ai keys');
    var keys = r.keys || {};
    Object.keys(keys).forEach(function (p) {
      var k = keys[p] || {};
      var st = k.total === 0 ? null : k.available > 0;
      box.appendChild(row(p, st, k.total + ' key | ' + k.available + ' chalu' + (k.cooling ? ' | ' + k.cooling + ' cooldown' : '')));
    });
    var t = r.today || {};
    h2(box, 'aaj');
    box.appendChild(row('sawal', t.fail ? null : true, 'kul ' + t.requests + ' | ok ' + t.ok + ' | fail ' + t.fail + (t.available ? '' : ' (ginti band)')));
    h2(box, 'haal ki errors');
    var errs = r.recentErrors || [];
    if (!errs.length) { var n = document.createElement('p'); n.className = 'small'; n.textContent = 'koi error record nahi.'; box.appendChild(n); }
    errs.forEach(function (e) { box.appendChild(row(e.type || '?', false, [e.t, e.code, e.provider].filter(Boolean).join(' | '))); });
    renderRoute(r);
    var ts = document.createElement('p'); ts.className = 'small'; ts.textContent = 'checked: ' + (r.checkedAt || ''); box.appendChild(ts);
  }
  var ROUTE_NOTE = {
    media: 'photo / PDF', facts: 'rate, tax, scheme (verified)', calc: 'calculator wale sawal',
    chat: 'concept / aam baatein', long: 'lamba text / file ka text'
  };
  function renderRoute(r) {
    var box = $('routeBox'); box.textContent = '';
    var rt = r.routing || {}; var picks = (r.today && r.today.picks) || {};
    var keys = r.keys || {};
    box.appendChild(row('AI_ROUTING override', rt.override ? true : null, rt.override ? 'laga hai' : 'nahi laga (default order)'));
    Object.keys(rt.profiles || {}).forEach(function (cat) {
      h2(box, cat + ' - ' + (ROUTE_NOTE[cat] || ''));
      var live = rt.profiles[cat].filter(function (n) { return keys[n] && keys[n].total > 0; });
      var line = document.createElement('div'); line.className = 'ln ai';
      line.textContent = live.length ? live.join(' > ') : 'koi provider (key) nahi';
      box.appendChild(line);
      box.appendChild(row('aaj is type ke jawab', true, String(picks[cat] || 0)));
    });
    var n = document.createElement('p'); n.className = 'small';
    n.textContent = 'Sirf wahi provider dikhte hain jinki key lagi hai. Jiski saari keys limit par hon, wo apne aap peeche chala jata hai.';
    box.appendChild(n);
  }

  function loadStatus() {
    setMsg('statusMsg', 'scan chal raha hai...');
    return jfetch('/api/admin/status').then(function (j) {
      if (j.status === 401) { showLogin(); return; }
      if (j.status !== 200) { setMsg('statusMsg', 'Status nahi mila.', 'bad'); return; }
      setMsg('statusMsg', ''); render(j);
    }).catch(function () { setMsg('statusMsg', 'Network ki dikkat.', 'bad'); });
  }
  $('refreshBtn').addEventListener('click', loadStatus);

  /* ---------- glossary ---------- */
  function loadGlossary() {
    return jfetch('/api/admin/glossary').then(function (j) {
      if (j.status === 401) { showLogin(); return; }
      var box = $('gList'); box.textContent = '';
      (j.entries || []).forEach(function (e) {
        var w = document.createElement('div'); w.className = 'row';
        var l = document.createElement('span'); l.textContent = e.term;
        var r = document.createElement('span');
        var ed = document.createElement('button'); ed.type = 'button'; ed.className = 'btn'; ed.textContent = 'edit';
        ed.addEventListener('click', function () { $('gTerm').value = e.term; $('gText').value = e.text; setMsg('gMsg', 'edit karke save dabayein.'); });
        var del = document.createElement('button'); del.type = 'button'; del.className = 'btn warn'; del.textContent = 'rm'; del.style.marginLeft = '6px';
        del.addEventListener('click', function () {
          if (!confirm('"' + e.term + '" hatana hai?')) return;
          jfetch('/api/admin/glossary?term=' + encodeURIComponent(e.term), { method: 'DELETE' })
            .then(function (d) { setMsg('gMsg', d.message || 'hata diya.', d.ok ? 'ok' : 'bad'); loadGlossary(); });
        });
        r.appendChild(ed); r.appendChild(del); w.appendChild(l); w.appendChild(r); box.appendChild(w);
      });
      if (!(j.entries || []).length) { var n = document.createElement('p'); n.className = 'small'; n.textContent = 'abhi koi entry nahi.'; box.appendChild(n); }
    }).catch(function () { setMsg('gMsg', 'Glossary load nahi hui.', 'bad'); });
  }
  $('gSaveBtn').addEventListener('click', function () {
    $('gSaveBtn').disabled = true;
    postJson('/api/admin/glossary', { term: $('gTerm').value.trim(), text: $('gText').value.trim() }).then(function (d) {
      setMsg('gMsg', d.message || 'Save nahi hua.', d.ok ? 'ok' : 'bad');
      if (d.ok) { $('gTerm').value = ''; $('gText').value = ''; loadGlossary(); }
    }).catch(function () { setMsg('gMsg', 'Network ki dikkat.', 'bad'); })
      .then(function () { $('gSaveBtn').disabled = false; });
  });

  /* ---------- sawal report ---------- */
  function loadReport() {
    return jfetch('/api/admin/report').then(function (j) {
      if (j.status === 401) { showLogin(); return; }
      var box = $('qReport'); box.textContent = '';
      if (!j.ok) { box.textContent = 'report nahi mili.'; return; }
      var t = j.totals || {};
      h2(box, 'aaj ' + (j.day || ''));
      box.appendChild(row('kul sawal', true, String(t.asked)));
      box.appendChild(row('jawab mila', true, t.answered + ' | tayyar ' + t.knowledge + ' | glossary ' + t.glossary));
      box.appendChild(row('fail/fallback', (t.failed + t.fallback) === 0 ? true : null, t.failed + ' fail | ' + t.fallback + ' fallback'));
      if (!j.available) { var nt = document.createElement('p'); nt.className = 'small'; nt.textContent = 'upstash band hai, data khaali.'; box.appendChild(nt); }
      h2(box, 'topics');
      (j.topics || []).forEach(function (x) { box.appendChild(row(x.topic, x.missed === 0 ? true : null, x.asked + ' pucha | ' + x.missed + ' miss')); });
      if (!(j.topics || []).length) { var n = document.createElement('p'); n.className = 'small'; n.textContent = 'abhi koi topic nahi.'; box.appendChild(n); }
    }).catch(function () { $('qReport').textContent = 'report load nahi hui.'; });
  }
})();
</script>
</body>
</html>
